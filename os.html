<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Continuum OS</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Space Grotesk',sans-serif;
}

body{
background:#000;
color:#fff;
height:100vh;
overflow:hidden;
}

/* TOP BAR */
.topbar{
position:fixed;
top:0;
left:0;
width:100%;
height:60px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
border-bottom:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
background:rgba(0,0,0,0.6);
z-index:10;
}

.brand{
display:flex;
align-items:center;
gap:12px;
cursor:pointer;
}

.brand img{
width:28px;
height:28px;
}

.brand span{
letter-spacing:4px;
font-size:14px;
opacity:0.9;
}

/* MAIN AREA */
.container{
display:flex;
height:100vh;
padding-top:60px;
}

/* LEFT PANEL */
.sidebar{
width:240px;
border-right:1px solid rgba(255,255,255,0.08);
padding:20px;
}

.tab{
padding:12px;
margin-bottom:10px;
border:1px solid rgba(255,255,255,0.08);
cursor:pointer;
transition:0.3s;
font-size:13px;
opacity:0.8;
}

.tab:hover{
background:white;
color:black;
}

/* CHAT AREA */
.main{
flex:1;
display:flex;
flex-direction:column;
}

.chatBox{
flex:1;
padding:20px;
overflow-y:auto;
}

.msg{
margin-bottom:15px;
line-height:1.5;
font-size:14px;
opacity:0.9;
}

.user{
color:#7dd3fc;
}

.ai{
color:#a3ffb0;
}

/* INPUT AREA */
.inputBar{
display:flex;
gap:10px;
padding:15px;
border-top:1px solid rgba(255,255,255,0.08);
background:rgba(0,0,0,0.6);
backdrop-filter:blur(10px);
}

input{
flex:1;
padding:12px;
background:black;
border:1px solid rgba(255,255,255,0.2);
color:white;
outline:none;
border-radius:8px;
}

button{
padding:12px 18px;
background:white;
color:black;
border:none;
cursor:pointer;
border-radius:8px;
transition:0.2s;
}

button:hover{
opacity:0.8;
}

/* RIGHT PANEL */
.panel{
width:300px;
border-left:1px solid rgba(255,255,255,0.08);
padding:20px;
overflow-y:auto;
}

.block{
margin-bottom:20px;
padding:15px;
border:1px solid rgba(255,255,255,0.08);
background:rgba(255,255,255,0.02);
}

.block h3{
font-size:12px;
letter-spacing:2px;
opacity:0.6;
margin-bottom:10px;
}

pre{
white-space:pre-wrap;
font-size:12px;
opacity:0.9;
}

/* MOBILE */
@media(max-width:900px){
.sidebar, .panel{
display:none;
}
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
<div class="brand" onclick="location.href='index.html'">
<img src="assets/logo.png">
<span>CONTINUUM OS</span>
</div>
</div>

<div class="container">

<!-- LEFT -->
<div class="sidebar">
<div class="tab">⚡ Chat</div>
<div class="tab">🧠 Research Mode</div>
<div class="tab">⚖ Compare Mode</div>
<div class="tab">💡 Ideas Mode</div>
<div class="tab" onclick="window.open('https://www.instagram.com/continuumonelabs/')">
📷 Follow Us
</div>
</div>

<!-- MAIN CHAT -->
<div class="main">

<div id="chat" class="chatBox"></div>

<div class="inputBar">
<input id="input" placeholder="Ask Continuum..." />
<button onclick="send()">Send</button>
</div>

</div>

<!-- RIGHT PANEL -->
<div class="panel">

<div class="block">
<h3>RESEARCH</h3>
<pre id="research">Waiting...</pre>
</div>

<div class="block">
<h3>COMPARE</h3>
<pre id="compare">Waiting...</pre>
</div>

<div class="block">
<h3>IDEAS</h3>
<pre id="ideas">Waiting...</pre>
</div>

</div>

</div>

<script>
async function send(){

const input = document.getElementById("input");
const text = input.value;
if(!text) return;

const chat = document.getElementById("chat");

chat.innerHTML += `<div class="msg user">You: ${text}</div>`;
input.value = "";

chat.innerHTML += `<div class="msg ai">Continuum: Thinking...</div>`;

const res = await fetch("http://localhost:3000/api/chat", {
method:"POST",
headers:{ "Content-Type":"application/json" },
body: JSON.stringify({ prompt: text })
});

const data = await res.json();

document.getElementById("research").innerText = data.research;
document.getElementById("compare").innerText = data.compare;
document.getElementById("ideas").innerText = data.ideas;

chat.innerHTML += `<div class="msg ai">Response generated ✔</div>`;

chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
