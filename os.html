<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Continuum OS</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#050505;
  --panel:rgba(255,255,255,0.04);
  --panel2:rgba(255,255,255,0.06);
  --text:#eaeaea;
  --muted:#9a9a9a;
  --border:rgba(255,255,255,0.08);
  --accent:#7c5cff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
}

/* subtle background */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 20%, rgba(124,92,255,0.08), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(255,255,255,0.03), transparent 40%);
  z-index:-2;
}

/* TOP BAR */
.topbar{
  height:52px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 18px;
  border-bottom:1px solid var(--border);
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(14px);
  font-size:12px;
  letter-spacing:1.5px;
  color:var(--muted);
}

/* LAYOUT */
.container{
  display:flex;
  height:calc(100vh - 52px);
}

/* SIDEBAR */
.sidebar{
  width:220px;
  border-right:1px solid var(--border);
  padding:14px;
  background:rgba(255,255,255,0.02);
}

.app{
  padding:10px 12px;
  margin-bottom:8px;
  border-radius:10px;
  font-size:13px;
  color:var(--muted);
  cursor:pointer;
  transition:0.2s ease;
  border:1px solid transparent;
}

.app:hover{
  background:var(--panel);
  color:var(--text);
  border:1px solid var(--border);
}

/* MAIN */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
}

/* CHAT */
.chat{
  flex:1;
  padding:24px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* MESSAGE */
.msg{
  max-width:72%;
  padding:12px 14px;
  border-radius:14px;
  font-size:14px;
  line-height:1.5;
  white-space:pre-wrap;
  border:1px solid var(--border);
}

/* user */
.user{
  align-self:flex-end;
  background:rgba(124,92,255,0.12);
}

/* ai */
.ai{
  align-self:flex-start;
  background:var(--panel);
  color:var(--text);
}

/* system */
.sys{
  align-self:center;
  font-size:12px;
  color:var(--muted);
  border:none;
  background:none;
}

/* INPUT */
.inputBar{
  display:flex;
  gap:10px;
  padding:14px;
  border-top:1px solid var(--border);
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(12px);
}

input{
  flex:1;
  padding:12px 14px;
  border-radius:12px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.03);
  color:var(--text);
  outline:none;
}

input:focus{
  border-color:rgba(124,92,255,0.4);
}

button{
  padding:12px 16px;
  border-radius:12px;
  border:none;
  background:var(--accent);
  color:white;
  font-weight:500;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  opacity:0.85;
}

</style>
</head>

<body>

<div class="topbar">
  <div>CONTINUUM</div>
  <div>AI WORKSPACE</div>
</div>

<div class="container">

  <div class="sidebar">
    <div class="app" onclick="sys('System check complete')">System</div>
    <div class="app" onclick="sys('Memory module active')">Memory</div>
    <div class="app" onclick="sys('AI Core online')">AI Core</div>
    <div class="app" onclick="clearChat()">Clear Chat</div>
  </div>

  <div class="main">

    <div class="chat" id="chat"></div>

    <div class="inputBar">
      <input id="input" placeholder="Ask Continuum..." />
      <button onclick="send()">Send</button>
    </div>

  </div>

</div>

<script>

const chat=document.getElementById("chat");
const input=document.getElementById("input");

function add(text,type){
  const div=document.createElement("div");
  div.className="msg "+type;
  div.textContent=text;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

function sys(text){
  add(text,"sys");
}

function clearChat(){
  chat.innerHTML="";
}

async function send(){

  const msg=input.value.trim();
  if(!msg) return;

  input.value="";

  add(msg,"user");
  add("Thinking...","ai");

  try{

    const res=await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({prompt:msg})
    });

    const data=await res.json();

    chat.lastChild.remove();

    add(
`🧠 Research:
${data.research}

⚖ Compare:
${data.compare}

💡 Ideas:
${data.ideas}`,
    "ai");

  }catch(e){
    chat.lastChild.remove();
    add("Connection error","sys");
  }

}

input.addEventListener("keydown",(e)=>{
  if(e.key==="Enter") send();
});

</script>

</body>
</html>
