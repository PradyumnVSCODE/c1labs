<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Continuum OS</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

/* ================= BASE ================= */
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
color:white;
font-family:'Space Grotesk',sans-serif;
overflow-x:hidden;
cursor:none;
}

/* ================= CURSOR ================= */
#cursor{
position:fixed;
width:18px;
height:18px;
border:1px solid rgba(255,255,255,.6);
border-radius:50%;
transform:translate(-50%,-50%);
pointer-events:none;
z-index:9999;
}

/* ================= BACKGROUND ================= */
body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 20%, rgba(255,255,255,.05), transparent 40%),
radial-gradient(circle at 80% 60%, rgba(0,255,255,.03), transparent 50%);
z-index:-1;
}

body::after{
content:"";
position:fixed;
inset:0;
background-image:
linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
background-size:60px 60px;
opacity:.12;
z-index:-1;
}

/* ================= SECTIONS ================= */
section{
min-height:100vh;
padding:120px 8%;
}

/* ================= CHAT CONTAINER ================= */
.chatBox{
height:420px;
overflow-y:auto;
padding:20px;
background:#050505;
border:1px solid rgba(255,255,255,.12);
font-family:monospace;
display:flex;
flex-direction:column;
gap:14px;
}

/* ================= MESSAGE BASE ================= */
.msg{
padding:12px 14px;
max-width:75%;
border-radius:10px;
line-height:1.4;
white-space:pre-wrap;
font-size:14px;
}

/* USER MESSAGE */
.user{
align-self:flex-end;
background:#1d4ed8;
border:1px solid rgba(255,255,255,.1);
}

/* AI MESSAGE */
.ai{
align-self:flex-start;
background:#111;
border:1px solid rgba(255,255,255,.15);
}

/* LABELS */
.label{
font-size:11px;
opacity:0.6;
margin-bottom:4px;
letter-spacing:1px;
}

/* INPUT AREA */
.inputRow{
display:flex;
gap:10px;
margin-top:15px;
}

input{
flex:1;
padding:12px;
background:#000;
border:1px solid rgba(255,255,255,.2);
color:white;
font-family:monospace;
outline:none;
}

button{
padding:12px 18px;
background:white;
color:black;
border:none;
cursor:pointer;
font-weight:600;
}

button:hover{
opacity:0.85;
}

</style>
</head>

<body>

<div id="cursor"></div>

<section>

<h2 style="margin-bottom:20px;">NEURAL CHAT INTERFACE</h2>

<div class="chatBox" id="chatBox"></div>

<div class="inputRow">
<input id="input" placeholder="Type command..." />
<button onclick="send()">EXECUTE</button>
</div>

</section>

<script>

/* ================= CURSOR ================= */
const cursor=document.getElementById("cursor");

document.addEventListener("mousemove",(e)=>{
cursor.style.left=e.clientX+"px";
cursor.style.top=e.clientY+"px";
});

/* ================= CHAT ================= */
const chatBox=document.getElementById("chatBox");
const input=document.getElementById("input");

function addMessage(text,type){
const wrapper=document.createElement("div");
wrapper.className="msg "+type;

const label=document.createElement("div");
label.className="label";
label.textContent= type==="user" ? "USER" : "CONTINUUM";

const content=document.createElement("div");
content.textContent=text;

wrapper.appendChild(label);
wrapper.appendChild(content);

chatBox.appendChild(wrapper);
chatBox.scrollTop=chatBox.scrollHeight;
}

async function send(){
const message=input.value.trim();
if(!message) return;

addMessage(message,"user");
input.value="";

addMessage("processing request...","ai");

try{
const res=await fetch("/api/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message})
});

const data=await res.json();

chatBox.lastChild.remove();
addMessage(data.reply || data.error || "error","ai");

}catch(err){
chatBox.lastChild.remove();
addMessage("connection failure","ai");
}
}

input.addEventListener("keydown",(e)=>{
if(e.key==="Enter") send();
});

</script>

</body>
</html>
