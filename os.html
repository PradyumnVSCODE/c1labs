<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Continuum OS // Unreal Interface</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

/* ======================
BASE
====================== */
*{margin:0;padding:0;box-sizing:border-box;}

body{
background:#000;
color:white;
font-family:'Space Grotesk',sans-serif;
overflow-x:hidden;
cursor:none;
}

/* ======================
CURSOR GLOW
====================== */
#cursor{
position:fixed;
width:20px;
height:20px;
border:1px solid rgba(255,255,255,.6);
border-radius:50%;
transform:translate(-50%,-50%);
pointer-events:none;
mix-blend-mode:difference;
transition:.05s;
z-index:9999;
}

/* ======================
PARTICLES
====================== */
canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

/* ======================
BOOT SCREEN
====================== */
#boot{
position:fixed;
inset:0;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:99999;
}

.bootLogo{
width:140px;
animation:glitch 1s infinite;
}

.bootText{
margin-top:20px;
letter-spacing:4px;
opacity:.6;
}

@keyframes glitch{
0%{transform:translate(0)}
20%{transform:translate(-2px,2px)}
40%{transform:translate(2px,-2px)}
60%{transform:translate(-1px,1px)}
80%{transform:translate(1px,-1px)}
100%{transform:translate(0)}
}

/* ======================
UI LAYERS
====================== */
section{
min-height:100vh;
padding:120px 8%;
opacity:0;
transform:translateY(40px);
transition:1s cubic-bezier(.2,.8,.2,1);
}

section.active{
opacity:1;
transform:translateY(0);
}

/* ======================
GLASS EFFECT
====================== */
.glass{
background:rgba(255,255,255,.03);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(20px);
}

/* ======================
TEXT
====================== */
.big{
font-size:clamp(2.5rem,6vw,6rem);
line-height:1.05;
}

.kicker{
opacity:.5;
letter-spacing:6px;
margin-bottom:15px;
}

/* ======================
HERO
====================== */
.hero{
min-height:100vh;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 8%;
transform-style:preserve-3d;
transition:transform .1s;
}

.hero h1{
font-size:clamp(3rem,7vw,7rem);
line-height:1;
text-shadow:0 0 30px rgba(255,255,255,.08);
}

/* ======================
MATRIX GRID
====================== */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-top:40px;
}

.card{
padding:25px;
border:1px solid rgba(255,255,255,.1);
background:rgba(255,255,255,.02);
transition:.3s;
transform:translateZ(0);
}

.card:hover{
transform:translateY(-10px) scale(1.02);
border-color:white;
}

/* ======================
TERMINAL
====================== */
.terminal{
margin-top:40px;
padding:25px;
background:#050505;
border:1px solid rgba(255,255,255,.1);
font-family:monospace;
line-height:1.8;
}

/* ======================
COUNTDOWN
====================== */
.countdown{
display:flex;
gap:15px;
flex-wrap:wrap;
margin-top:40px;
}

.box{
padding:20px;
border:1px solid rgba(255,255,255,.1);
min-width:120px;
text-align:center;
}

/* ======================
GLITCH TEXT
====================== */
.glitch{
position:relative;
animation:glitchText 2s infinite;
}

@keyframes glitchText{
0%{text-shadow:2px 0 red,-2px 0 cyan;}
50%{text-shadow:-2px 0 red,2px 0 cyan;}
100%{text-shadow:2px 0 red,-2px 0 cyan;}
}

</style>
</head>

<body>

<div id="cursor"></div>

<canvas id="particles"></canvas>

<!-- BOOT -->
<div id="boot">
<img src="assets/logo.png" class="bootLogo">
<div class="bootText">BOOTING CONTINUUM NEURAL CORE...</div>
</div>

<!-- HERO -->
<section class="active">
<div class="hero" id="hero">
<div>
<h1 class="glitch">Continuum OS</h1>
<p>Neural execution layer for intelligence.</p>
</div>
</div>
</section>

<!-- STATUS -->
<section>
<div class="kicker">SYSTEM STATUS</div>
<div class="big">CORE ONLINE</div>
</section>

<!-- MODES -->
<section>
<div class="kicker">MISSION MATRIX</div>

<div class="grid">

<div class="card">RESEARCH</div>
<div class="card">BUILD</div>
<div class="card">ANALYZE</div>
<div class="card">EXECUTE</div>

</div>

</section>

<!-- TERMINAL -->
<section>
<div class="kicker">NEURAL TERMINAL</div>

<div class="terminal" id="term">
> initializing neural mesh...
</div>

</section>

<!-- COUNTDOWN -->
<section>
<div class="kicker">PROTOTYPE 01</div>
<div class="big">Launching Soon</div>

<div class="countdown">
<div class="box"><h2 id="d">00</h2>D</div>
<div class="box"><h2 id="h">00</h2>H</div>
<div class="box"><h2 id="m">00</h2>M</div>
<div class="box"><h2 id="s">00</h2>S</div>
</div>

</section>

<script>

/* ======================
BOOT
====================== */
setTimeout(()=>{
document.getElementById("boot").style.display="none";
},2200);

/* ======================
CURSOR
====================== */
const cursor = document.getElementById("cursor");

document.addEventListener("mousemove",(e)=>{
cursor.style.left = e.clientX+"px";
cursor.style.top = e.clientY+"px";

document.getElementById("hero").style.transform =
`rotateX(${(e.clientY-window.innerHeight/2)*0.01}deg)
 rotateY(${(e.clientX-window.innerWidth/2)*0.01}deg)`;
});

/* ======================
SCROLL REVEAL
====================== */
const sections = document.querySelectorAll("section");

window.addEventListener("scroll",()=>{
sections.forEach(s=>{
if(s.getBoundingClientRect().top < window.innerHeight-100){
s.classList.add("active");
}
});
});

/* ======================
COUNTDOWN
====================== */
const target = new Date("June 10, 2026").getTime();

setInterval(()=>{
let now = new Date().getTime();
let d = target-now;

document.getElementById("d").innerText=Math.floor(d/86400000);
document.getElementById("h").innerText=Math.floor(d%86400000/3600000);
document.getElementById("m").innerText=Math.floor(d%3600000/60000);
document.getElementById("s").innerText=Math.floor(d%60000/1000);
},1000);

/* ======================
PARTICLES
====================== */
const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

let particles=[];

for(let i=0;i<80;i++){
particles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2
});
}

function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);

particles.forEach(p=>{
ctx.fillStyle="white";
ctx.globalAlpha=0.2;
ctx.beginPath();
ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
ctx.fill();

p.y+=0.3;
if(p.y>canvas.height)p.y=0;
});

requestAnimationFrame(animate);
}

animate();

/* ======================
TERMINAL STREAM
====================== */
let i=0;
let lines=[
"loading neural core...",
"mapping intent space...",
"optimizing execution layer...",
"system online"
];

setInterval(()=>{
if(i<lines.length){
document.getElementById("term").innerHTML += "<br>> "+lines[i];
i++;
}
},1200);

</script>

</body>
</html>
