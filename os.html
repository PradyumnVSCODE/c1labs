<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Continuum OS // NEURAL KERNEL</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

/* ================= BASE ================= */
*{margin:0;padding:0;box-sizing:border-box;}

body{
background:#000;
color:#fff;
font-family:'Space Grotesk',sans-serif;
cursor:none;
overflow:hidden;
}

/* ================= CURSOR ================= */
#cursor{
position:fixed;
width:14px;height:14px;
border:1px solid rgba(255,255,255,.7);
border-radius:50%;
transform:translate(-50%,-50%);
pointer-events:none;
z-index:9999;
}

/* ================= GRID ================= */
body::before{
content:"";
position:fixed;inset:0;
background:
radial-gradient(circle at 30% 20%, rgba(0,255,255,.05), transparent 40%),
radial-gradient(circle at 70% 70%, rgba(255,255,255,.03), transparent 50%);
z-index:-2;
}

body::after{
content:"";
position:fixed;inset:0;
background-image:
linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
background-size:60px 60px;
opacity:.08;
z-index:-1;
}

/* ================= TOP BAR ================= */
.topbar{
position:fixed;
top:0;left:0;right:0;
height:50px;
display:flex;
align-items:center;
padding:0 20px;
background:rgba(0,0,0,.6);
backdrop-filter:blur(20px);
border-bottom:1px solid rgba(255,255,255,.1);
z-index:10;
font-size:12px;
letter-spacing:2px;
}

/* ================= CHAT AREA ================= */
.main{
padding-top:60px;
height:100vh;
display:flex;
flex-direction:column;
}

.log{
flex:1;
padding:20px;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:10px;
}

/* ================= MESSAGE ================= */
.line{
font-family:monospace;
font-size:13px;
white-space:pre-wrap;
opacity:.9;
}

.user{color:#60a5fa;}
.ai{color:#e5e7eb;}
.sys{color:#34d399;}
.err{color:#f87171;}

/* ================= INPUT ================= */
.inputBar{
display:flex;
padding:15px;
border-top:1px solid rgba(255,255,255,.1);
background:rgba(0,0,0,.8);
}

input{
flex:1;
background:#000;
border:1px solid rgba(255,255,255,.2);
color:white;
padding:12px;
font-family:monospace;
outline:none;
}

button{
padding:12px 18px;
margin-left:10px;
background:#fff;
border:none;
cursor:pointer;
font-weight:600;
}

/* ================= SCROLLBAR ================= */
.log::-webkit-scrollbar{width:6px;}
.log::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);}

</style>
</head>

<body>

<div id="cursor"></div>

<div class="topbar">
CONTINUUM OS // NEURAL KERNEL ACTIVE
</div>

<div class="main">

<div class="log" id="log"></div>

<div class="inputBar">
<input id="input" placeholder="type /help or ask anything..." />
<button onclick="run()">EXEC</button>
</div>

</div>

<script>

/* ================= CURSOR ================= */
const cursor=document.getElementById("cursor");
document.addEventListener("mousemove",(e)=>{
cursor.style.left=e.clientX+"px";
cursor.style.top=e.clientY+"px";
});

/* ================= LOG SYSTEM ================= */
const log=document.getElementById("log");

function add(text,type="ai"){
const div=document.createElement("div");
div.className="line "+type;
div.textContent=text;
log.appendChild(div);
log.scrollTop=log.scrollHeight;
}

/* ================= BOOT ================= */
add("[BOOT] initializing continuum kernel...","sys");
add("[BOOT] memory layer: online","sys");
add("[BOOT] ai interface: connected","sys");
add("[BOOT] system ready","sys");

/* ================= COMMAND ENGINE ================= */
function handleCommand(cmd){

if(cmd.startsWith("/")){
const c=cmd.toLowerCase();

/* HELP */
if(c==="/help"){
add("AVAILABLE COMMANDS:\n/help\n/clear\n/ping\n/status","sys");
return;
}

/* CLEAR */
if(c==="/clear"){
log.innerHTML="";
return;
}

/* PING */
if(c==="/ping"){
add("pong.","sys");
return;
}

/* STATUS */
if(c==="/status"){
add("SYSTEM: stable\nAI: active\nAPI: connected","sys");
return;
}
}

/* DEFAULT → AI */
callAI(cmd);
}

/* ================= AI CALL ================= */
async function callAI(message){

add("> "+message,"user");
add("[processing neural request...]","sys");

try{

const res=await fetch("/api/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message})
});

const data=await res.json();

log.lastChild.remove();
add(data.reply || data.error,"ai");

}catch(e){
log.lastChild.remove();
add("[connection failure]","err");
}
}

/* ================= RUN ================= */
function run(){
const input=document.getElementById("input");
const val=input.value.trim();
if(!val) return;

input.value="";
handleCommand(val);
}

document.getElementById("input").addEventListener("keydown",(e)=>{
if(e.key==="Enter") run();
});

</script>

</body>
</html>
