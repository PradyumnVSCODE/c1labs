<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Continuum OS</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

/* ================= BASE ================= */
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
color:white;
font-family:'Space Grotesk',sans-serif;
overflow:hidden;
}

/* ================= SUBTLE BACKGROUND ================= */
body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 20%, rgba(255,255,255,.06), transparent 40%),
radial-gradient(circle at 80% 70%, rgba(120,120,255,.05), transparent 50%);
z-index:-2;
}

body::after{
content:"";
position:fixed;
inset:0;
background-image:
linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
background-size:70px 70px;
opacity:.08;
z-index:-1;
}

/* ================= TOP BAR (APPLE STYLE) ================= */
.topbar{
position:fixed;
top:0;
left:0;
right:0;
height:50px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
background:rgba(0,0,0,.55);
backdrop-filter:blur(20px);
border-bottom:1px solid rgba(255,255,255,.08);
font-size:12px;
letter-spacing:2px;
z-index:100;
}

/* ================= MAIN LAYOUT ================= */
.container{
display:flex;
height:100vh;
padding-top:50px;
}

/* ================= SIDEBAR ================= */
.sidebar{
width:240px;
padding:20px;
border-right:1px solid rgba(255,255,255,.08);
background:rgba(255,255,255,.02);
backdrop-filter:blur(10px);
}

.app{
padding:12px;
margin-bottom:10px;
border-radius:10px;
cursor:pointer;
transition:.2s;
border:1px solid rgba(255,255,255,.06);
font-size:13px;
}

.app:hover{
background:rgba(255,255,255,.06);
}

/* ================= MAIN PANEL ================= */
.main{
flex:1;
display:flex;
flex-direction:column;
}

/* ================= CHAT AREA ================= */
.chat{
flex:1;
padding:30px;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:18px;
}

/* ================= MESSAGE BUBBLES (APPLE STYLE) ================= */
.msg{
max-width:70%;
padding:14px 16px;
border-radius:16px;
font-size:14px;
line-height:1.5;
white-space:pre-wrap;
}

/* USER */
.user{
align-self:flex-end;
background:rgba(80,140,255,.25);
border:1px solid rgba(120,160,255,.25);
}

/* AI */
.ai{
align-self:flex-start;
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.08);
}

/* SYSTEM */
.sys{
align-self:center;
opacity:.6;
font-size:12px;
}

/* ================= INPUT BAR ================= */
.inputBar{
display:flex;
padding:20px;
border-top:1px solid rgba(255,255,255,.08);
background:rgba(0,0,0,.6);
backdrop-filter:blur(15px);
}

input{
flex:1;
padding:14px;
border-radius:12px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.1);
color:white;
outline:none;
font-size:14px;
}

button{
margin-left:10px;
padding:14px 18px;
border-radius:12px;
border:none;
background:white;
color:black;
font-weight:600;
cursor:pointer;
transition:.2s;
}

button:hover{
opacity:.8;
}

</style>
</head>

<body>

<div class="topbar">
<div>CONTINUUM OS</div>
<div>NEURAL AI WORKSPACE</div>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<div class="app" onclick="sysMsg('System check complete')">System</div>
<div class="app" onclick="sysMsg('Memory module active')">Memory</div>
<div class="app" onclick="sysMsg('AI engine online')">AI Core</div>
<div class="app" onclick="clearChat()">Clear</div>
</div>

<!-- MAIN -->
<div class="main">

<div class="chat" id="chat"></div>

<div class="inputBar">
<input id="input" placeholder="Message Continuum..." />
<button onclick="send()">Send</button>
</div>

</div>

</div>
<script>

const chat=document.getElementById("chat");
const input=document.getElementById("input");

function add(text,type){
  const div=document.createElement("div");
  div.className="msg "+type;
  div.textContent=text;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
  return div;
}

/* ================= TYPING ANIMATION ================= */
function typeText(element, text, speed=15){
  element.textContent = "";
  let i = 0;

  const interval = setInterval(() => {
    element.textContent += text[i];
    i++;
    chat.scrollTop = chat.scrollHeight;

    if(i >= text.length){
      clearInterval(interval);
    }
  }, speed);
}

/* ================= SYSTEM MSG ================= */
function sysMsg(text){
  add(text,"sys");
}

function clearChat(){
  chat.innerHTML="";
}

/* ================= AI CALL ================= */
async function send(){

  const msg=input.value.trim();
  if(!msg) return;

  input.value="";

  add(msg,"user");

  const loading = add("Thinking...","ai");

  try{

    const res = await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({prompt:msg})
    });

    const data = await res.json();

    loading.remove();

    if(!data.research || !data.compare || !data.ideas){
      add("⚠ Invalid response from server","sys");
      return;
    }

    const finalText =
`🧠 Research:
${data.research}

⚖ Compare:
${data.compare}

💡 Ideas:
${data.ideas}`;

    const aiMsg = add("","ai");
    typeText(aiMsg, finalText, 10);

  }catch(e){
    loading.remove();
    add("Connection error / backend not reachable","sys");
  }

}

/* ENTER KEY SUPPORT */
input.addEventListener("keydown",(e)=>{
  if(e.key==="Enter") send();
});

</script>

</body>
</html>
