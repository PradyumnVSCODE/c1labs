<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Continuum OS // FINAL FORM</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

/* ================= BASE ================= */
*{margin:0;padding:0;box-sizing:border-box;}

body{
background:#000;
color:white;
font-family:'Space Grotesk',sans-serif;
overflow:hidden;
}

/* ================= DESKTOP ================= */
#desktop{
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 20%, rgba(0,255,255,.06), transparent 40%),
radial-gradient(circle at 80% 80%, rgba(255,255,255,.04), transparent 50%);
}

/* grid */
#desktop::after{
content:"";
position:absolute;
inset:0;
background-image:
linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
background-size:60px 60px;
opacity:.1;
}

/* ================= TOPBAR ================= */
#bar{
position:fixed;
top:0;left:0;right:0;
height:45px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
background:rgba(0,0,0,.6);
backdrop-filter:blur(20px);
border-bottom:1px solid rgba(255,255,255,.1);
z-index:1000;
font-size:12px;
letter-spacing:2px;
}

/* ================= LAUNCHER ================= */
#launcher{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:10px;
}

.app{
padding:10px 14px;
border:1px solid rgba(255,255,255,.2);
cursor:pointer;
font-size:12px;
background:#000;
}

/* ================= WINDOWS ================= */
.window{
position:absolute;
width:420px;
height:300px;
background:#050505;
border:1px solid rgba(255,255,255,.15);
display:flex;
flex-direction:column;
}

.titlebar{
height:30px;
background:#111;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 10px;
cursor:move;
font-size:12px;
}

.content{
flex:1;
padding:10px;
overflow:auto;
font-family:monospace;
font-size:13px;
}

/* ================= INPUT ================= */
input{
width:100%;
padding:10px;
background:#000;
border:1px solid rgba(255,255,255,.2);
color:white;
outline:none;
font-family:monospace;
}

button{
margin-top:8px;
padding:8px 12px;
background:white;
border:none;
cursor:pointer;
font-weight:600;
}

/* ================= LOG ================= */
.line{margin:5px 0;}
.user{color:#60a5fa;}
.ai{color:#e5e7eb;}
.sys{color:#34d399;}

</style>
</head>

<body>

<div id="desktop"></div>

<div id="bar">
<div>CONTINUUM OS // FINAL FORM</div>
<div id="time"></div>
</div>

<div id="launcher">
<div class="app" onclick="openWindow('ai')">AI</div>
<div class="app" onclick="openWindow('notes')">NOTES</div>
<div class="app" onclick="openWindow('sys')">SYSTEM</div>
</div>

<script>

/* ================= TIME ================= */
setInterval(()=>{
document.getElementById("time").innerText=new Date().toLocaleTimeString();
},1000);

/* ================= WINDOW SYSTEM ================= */
let z=10;

function createWindow(id,title){

const win=document.createElement("div");
win.className="window";
win.style.top="80px";
win.style.left="80px";
win.style.zIndex=z++;

win.innerHTML=`
<div class="titlebar">
<span>${title}</span>
<span onclick="this.parentElement.parentElement.remove()" style="cursor:pointer">X</span>
</div>
<div class="content" id="${id}"></div>
`;

document.body.appendChild(win);

/* drag */
let bar=win.querySelector(".titlebar");
let offsetX,offsetY,drag=false;

bar.onmousedown=(e)=>{
drag=true;
offsetX=e.clientX-win.offsetLeft;
offsetY=e.clientY-win.offsetTop;
};

document.onmousemove=(e)=>{
if(drag){
win.style.left=(e.clientX-offsetX)+"px";
win.style.top=(e.clientY-offsetY)+"px";
}
};

document.onmouseup=()=>drag=false;

return win;
}

/* ================= AI APP ================= */
function openWindow(type){

if(type==="ai"){

let win=createWindow("aiBox","NEURAL AI");

const box=document.getElementById("aiBox");

box.innerHTML=`
<div id="log"></div>
<input id="inp" placeholder="ask continuum..." />
<button onclick="sendAI()">EXEC</button>
`;

}

if(type==="notes"){

let win=createWindow("notesBox","NOTES");

document.getElementById("notesBox").innerHTML=`
<textarea style="width:100%;height:100%;background:#000;color:white;border:none;outline:none;font-family:monospace;"></textarea>
`;

}

if(type==="sys"){

let win=createWindow("sysBox","SYSTEM");

document.getElementById("sysBox").innerHTML=`
<div class="line sys">kernel: active</div>
<div class="line sys">ai: online</div>
<div class="line sys">memory: stable</div>
`;
}

}

/* ================= AI CALL ================= */
async function sendAI(){

const inp=document.getElementById("inp");
const log=document.getElementById("log");

const msg=inp.value;
if(!msg)return;

log.innerHTML+=`<div class="line user">> ${msg}</div>`;
inp.value="";

try{

const res=await fetch("/api/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message:msg})
});

const data=await res.json();

log.innerHTML+=`<div class="line ai">${data.reply}</div>`;

}catch(e){
log.innerHTML+=`<div class="line sys">connection error</div>`;
}

}

</script>

</body>
</html>
