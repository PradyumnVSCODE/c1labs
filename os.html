<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Continuum OS</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0f17;
    color: white;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* TOP BAR */
  .topbar {
    background: #111827;
    padding: 12px 18px;
    font-weight: bold;
    border-bottom: 1px solid #1f2937;
  }

  /* CHAT AREA */
  .chat {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .msg {
    max-width: 70%;
    padding: 12px 14px;
    border-radius: 12px;
    line-height: 1.4;
    white-space: pre-wrap;
  }

  .user {
    align-self: flex-end;
    background: #3b82f6;
  }

  .ai {
    align-self: flex-start;
    background: #1f2937;
  }

  /* INPUT AREA */
  .input-bar {
    display: flex;
    padding: 12px;
    border-top: 1px solid #1f2937;
    background: #0f172a;
  }

  input {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    outline: none;
    background: #111827;
    color: white;
  }

  button {
    margin-left: 10px;
    padding: 12px 16px;
    border: none;
    border-radius: 8px;
    background: #22c55e;
    color: black;
    font-weight: bold;
    cursor: pointer;
  }

  button:hover {
    background: #16a34a;
  }

  .typing {
    font-style: italic;
    opacity: 0.7;
  }
</style>
</head>

<body>

<div class="topbar">⚡ Continuum OS</div>

<div id="chat" class="chat"></div>

<div class="input-bar">
  <input id="input" placeholder="Ask Continuum..." />
  <button onclick="send()">Send</button>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const message = input.value.trim();
  if (!message) return;

  addMessage(message, "user");
  input.value = "";

  const typing = document.createElement("div");
  typing.className = "msg ai typing";
  typing.textContent = "Thinking...";
  chat.appendChild(typing);
  chat.scrollTop = chat.scrollHeight;

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message })
    });

    const data = await res.json();

    typing.remove();
    addMessage(data.reply || data.error || "No response", "ai");

  } catch (err) {
    typing.remove();
    addMessage("Error connecting to server", "ai");
  }
}

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") send();
});
</script>

</body>
</html>
