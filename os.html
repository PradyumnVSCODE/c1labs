<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Continuum OS</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:"Space Grotesk";
}

/* layout */
.container{
  display:flex;
  height:100vh;
}

/* sidebar */
.sidebar{
  width:240px;
  border-right:1px solid rgba(255,255,255,0.08);
  padding:20px;
  opacity:0.8;
}

/* chat area */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
}

/* messages */
.chat{
  flex:1;
  padding:20px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:12px;
}

/* bubbles */
.msg{
  max-width:70%;
  padding:12px 14px;
  border-radius:12px;
  font-size:14px;
  line-height:1.5;
}

.user{
  align-self:flex-end;
  background:rgba(255,255,255,0.12);
}

.ai{
  align-self:flex-start;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
}

/* input bar */
.inputBar{
  display:flex;
  padding:14px;
  border-top:1px solid rgba(255,255,255,0.08);
}

input{
  flex:1;
  background:transparent;
  border:none;
  outline:none;
  color:white;
  font-size:14px;
}

button{
  background:white;
  border:none;
  padding:10px 16px;
  cursor:pointer;
  font-weight:500;
}

button:hover{
  opacity:0.85;
}

</style>
</head>

<body>

<div class="container">

  <div class="sidebar">
    <h3>CONTINUUM OS</h3>
    <p>Memory</p>
    <p>Reasoning</p>
    <p>Tools</p>
  </div>

  <div class="main">

    <div class="chat" id="chat">
      <div class="msg ai">Continuum online.</div>
    </div>

    <div class="inputBar">
      <input id="input" placeholder="Enter intent..." />
      <button onclick="send()">Send</button>
    </div>

  </div>

</div>

<script src="app.js"></script>

</body>
</html>
