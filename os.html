<body>

<div class="background-logo">
  <img src="assets/logo.png">
</div>

<div class="topbar">

  <div class="brand">
    <img src="assets/logo.png">
    <span>CONTINUUM ONE</span>
  </div>

  <div class="status">
    SYSTEM ONLINE
  </div>

</div>

<div class="center">

  <h1>
    What would you like to accomplish?
  </h1>

  <p>
    Describe an outcome.
    Continuum handles the path.
  </p>

  <div class="command-box">

    <input
      id="input"
      placeholder="Build a startup..."
    >

    <button onclick="send()">
      EXECUTE
    </button>

  </div>

</div>

<div class="panels">

  <div class="panel">
    <h3>Reasoning</h3>
    <span>ACTIVE</span>
  </div>

  <div class="panel">
    <h3>Memory</h3>
    <span>ONLINE</span>
  </div>

  <div class="panel">
    <h3>Agents</h3>
    <span>READY</span>
  </div>

  <div class="panel">
    <h3>Execution</h3>
    <span>WAITING</span>
  </div>

</div>

<div id="chat"></div>

<script src="ap.js"></script>

</body>
