<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Continuum OS</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Space Grotesk',sans-serif;
}

body{
background:#000;
color:#fff;
height:100vh;
overflow:hidden;
}

.topbar{
height:55px;
display:flex;
align-items:center;
padding:0 20px;
border-bottom:1px solid rgba(255,255,255,0.08);
background:rgba(0,0,0,0.7);
backdrop-filter:blur(10px);
}

.brand{
cursor:pointer;
letter-spacing:4px;
font-size:13px;
display:flex;
align-items:center;
gap:10px;
}

.brand img{
width:24px;
height:24px;
}

.container{
display:flex;
height:calc(100vh - 55px);
}

.sidebar{
width:200px;
border-right:1px solid rgba(255,255,255,0.08);
padding:15px;
}

.tab{
padding:10px;
margin-bottom:10px;
border:1px solid rgba(255,255,255,0.08);
cursor:pointer;
font-size:12px;
opacity:0.8;
}

.tab:hover{
background:#fff;
color:#000;
}

.main{
flex:1;
display:flex;
flex-direction:column;
}

.chatBox{
flex:1;
padding:15px;
overflow-y:auto;
}

.msg{
margin-bottom:10px;
font-size:13px;
line-height:1.4;
}

.user{ color:#7dd3fc; }
.ai{ color:#a3ffb0; }

.inputBar{
display:flex;
gap:10px;
padding:10px;
border-top:1px solid rgba(255,255,255,0.08);
}

input{
flex:1;
padding:10px;
background:black;
border:1px solid rgba(255,255,255,0.2);
color:white;
outline:none;
}

button{
padding:10px 15px;
background:white;
color:black;
border:none;
cursor:pointer;
}

.panel{
width:250px;
border-left:1px solid rgba(255,255,255,0.08);
padding:15px;
font-size:12px;
opacity:0.8;
overflow-y:auto;
}

.block{
margin-bottom:20px;
}

pre{
white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="topbar">
<div class="brand" onclick="location.href='index.html'">
<img src="assets/logo.png">
CONTINUUM OS
</div>
</div>

<div class="container">

<div class="sidebar">
<div class="tab">Chat</div>
<div class="tab" onclick="window.open('https://www.instagram.com/continuumonelabs/')">
Follow
</div>
</div>

<div class="main">

<div id="chat" class="chatBox"></div>

<div class="inputBar">
<input id="input" placeholder="Ask Continuum..." />
<button onclick="send()">Send</button>
</div>

</div>

<div class="panel">
<div class="block">
<b>Research</b>
<pre id="research">-</pre>
</div>

<div class="block">
<b>Compare</b>
<pre id="compare">-</pre>
</div>

<div class="block">
<b>Ideas</b>
<pre id="ideas">-</pre>
</div>
</div>

</div>

<script>
async function send(){

const input = document.getElementById("input");
const text = input.value.trim();
if(!text) return;

const chat = document.getElementById("chat");

chat.innerHTML += `<div class="msg user">You: ${text}</div>`;
input.value = "";

chat.innerHTML += `<div class="msg ai">Continuum: thinking...</div>`;
chat.scrollTop = chat.scrollHeight;

try{

const res = await fetch("http://localhost:3000/api/chat", {
method:"POST",
headers:{ "Content-Type":"application/json" },
body: JSON.stringify({ prompt: text })
});

if(!res.ok){
chat.innerHTML += `<div class="msg ai">Server error.</div>`;
return;
}

const data = await res.json();

document.getElementById("research").innerText = data.research || "-";
document.getElementById("compare").innerText = data.compare || "-";
document.getElementById("ideas").innerText = data.ideas || "-";

chat.innerHTML += `<div class="msg ai">Response ready ✔</div>`;

}catch(err){

console.log(err);
chat.innerHTML += `<div class="msg ai">Connection error (backend not reachable)</div>`;
}

chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
