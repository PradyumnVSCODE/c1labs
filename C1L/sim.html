<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ContinuumOne &mdash; C1 SIMULATOR</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#000000; --panel-0:#050506; --panel-1:#0a0a0c; --panel-2:#101013; --panel-3:#17171b;
  --hairline:rgba(255,255,255,0.07); --hairline-strong:rgba(255,255,255,0.14);
  --silver-0:#6f7075; --silver-1:#9a9ba2; --silver-2:#c7c8cd; --silver-3:#eceef1; --white:#f4f5f7;
  --text-1:#eceef0; --text-2:#9498a0; --text-3:#56585f;
  --amber:#c99a4a; --amber-dim:#7a6032; --red:#b64848; --red-dim:#6e2f2f; --good:#8fa89a; --good-dim:#4d5f56;
  --grid-line:rgba(255,255,255,0.035);
  --font-display:'Oswald','Arial Narrow',sans-serif; --font-mono:'IBM Plex Mono','Courier New',monospace; --font-body:'Inter',-apple-system,sans-serif;
  --radius:2px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--void);color:var(--text-1);font-family:var(--font-body);font-size:13px;overflow:hidden;-webkit-font-smoothing:antialiased;}
::selection{background:var(--silver-1);color:#000;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:var(--panel-0);}
::-webkit-scrollbar-thumb{background:var(--panel-3);border:1px solid var(--hairline-strong);}
::-webkit-scrollbar-thumb:hover{background:var(--silver-0);}
.bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse 90% 80% at 50% 20%,#000 40%,transparent 95%);mask-image:radial-gradient(ellipse 90% 80% at 50% 20%,#000 40%,transparent 95%);}
.bg-vignette{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 120% 100% at 50% 0%,transparent 0%,#000 92%);}
.mono{font-family:var(--font-mono);}
#boot{position:fixed;inset:0;z-index:9999;background:#000000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .7s ease;overflow:hidden;}
#boot .boot-bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.025) 1px,transparent 1px);background-size:38px 38px;-webkit-mask-image:radial-gradient(ellipse 60% 55% at 50% 50%,#000 0%,transparent 75%);mask-image:radial-gradient(ellipse 60% 55% at 50% 50%,#000 0%,transparent 75%);opacity:0;animation:bootGridIn 1s ease forwards .1s;}
@keyframes bootGridIn{to{opacity:1;}}
#boot .boot-frame{position:relative;width:min(88vw,640px);display:flex;flex-direction:column;align-items:center;}
#boot .boot-corner{position:absolute;width:16px;height:16px;opacity:0;animation:bootCornerIn .5s ease forwards 2.55s;}
#boot .boot-corner.tl{top:-30px;left:-18px;border-top:1px solid rgba(236,238,241,0.5);border-left:1px solid rgba(236,238,241,0.5);}
#boot .boot-corner.tr{top:-30px;right:-18px;border-top:1px solid rgba(236,238,241,0.5);border-right:1px solid rgba(236,238,241,0.5);}
#boot .boot-corner.bl{bottom:-30px;left:-18px;border-bottom:1px solid rgba(236,238,241,0.5);border-left:1px solid rgba(236,238,241,0.5);}
#boot .boot-corner.br{bottom:-30px;right:-18px;border-bottom:1px solid rgba(236,238,241,0.5);border-right:1px solid rgba(236,238,241,0.5);}
@keyframes bootCornerIn{0%{opacity:0;transform:scale(1.4);}100%{opacity:1;transform:scale(1);}}
#boot .boot-rule{height:1px;width:0%;background:linear-gradient(90deg,transparent,rgba(236,238,241,0.5) 50%,transparent);animation:bootRuleGrow 1.1s cubic-bezier(.65,0,.35,1) forwards;}
#boot .boot-rule.top{margin-bottom:22px;animation-delay:0s;}
#boot .boot-rule.bottom{margin-top:22px;animation-delay:2.15s;}
@keyframes bootRuleGrow{to{width:100%;}}
#boot .boot-wordmark-wrap{position:relative;width:100%;aspect-ratio:1089/74;}
#boot .boot-wordmark{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;clip-path:inset(0 100% 0 0);animation:bootReveal 1.7s cubic-bezier(.65,0,.35,1) forwards .35s;filter:drop-shadow(0 0 26px rgba(236,238,241,0.14));}
@keyframes bootReveal{to{clip-path:inset(0 0% 0 0);}}
#boot .boot-scanbar{position:absolute;top:-16px;bottom:-16px;width:2px;left:0%;opacity:0;background:linear-gradient(180deg,transparent,#eceef1 45%,#eceef1 55%,transparent);box-shadow:0 0 16px 3px rgba(236,238,241,0.85),0 0 40px 8px rgba(236,238,241,0.25);animation:bootScanMove 1.7s cubic-bezier(.65,0,.35,1) forwards .35s;}
@keyframes bootScanMove{0%{left:0%;opacity:1;}94%{opacity:1;}100%{left:100%;opacity:0;}}
#boot .boot-shimmer{position:absolute;inset:0;overflow:hidden;pointer-events:none;opacity:0;animation:bootShimmerIn .01s forwards 2.05s;}
#boot .boot-shimmer::after{content:'';position:absolute;top:-30%;bottom:-30%;left:-40%;width:22%;background:linear-gradient(75deg,transparent 0%,rgba(255,255,255,0.55) 48%,transparent 100%);mix-blend-mode:overlay;transform:translateX(0%) skewX(-18deg);animation:bootShimmerSweep 1.15s cubic-bezier(.4,0,.2,1) forwards 2.05s;}
@keyframes bootShimmerIn{to{opacity:1;}}
@keyframes bootShimmerSweep{0%{transform:translateX(-120%) skewX(-18deg);}100%{transform:translateX(620%) skewX(-18deg);}}
#boot .boot-tagline{margin-top:26px;font-family:var(--font-mono);font-size:10px;letter-spacing:.4em;color:var(--text-3);text-transform:uppercase;opacity:0;text-align:center;animation:bootTagIn .8s ease forwards 2.75s;}
@keyframes bootTagIn{0%{opacity:0;transform:translateY(4px);}100%{opacity:1;transform:translateY(0);}}
.c1-mark svg{display:block;}
.c1-mark .ring,.c1-mark .numeral{fill:none;stroke:url(#silverGrad);stroke-width:9;stroke-linecap:round;}
#app{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;opacity:0;transition:opacity .8s ease;}
#app.ready{opacity:1;}
#topbar{height:56px;flex:0 0 auto;display:flex;align-items:center;border-bottom:1px solid var(--hairline);background:linear-gradient(180deg,var(--panel-1),var(--panel-0));padding:0 18px;gap:18px;}
#topbar .brand{display:flex;align-items:center;gap:12px;padding-right:16px;border-right:1px solid var(--hairline);height:100%;}
#topbar .brand .c1-mark{width:26px;height:26px;}
#topbar .brand .brand-text{font-family:var(--font-display);font-weight:600;letter-spacing:.32em;font-size:14px;color:var(--white);}
#topbar .brand .brand-sub{font-family:var(--font-mono);font-size:9px;letter-spacing:.14em;color:var(--text-3);margin-top:2px;}
#topbar .status-ticker{display:flex;align-items:center;gap:22px;font-family:var(--font-mono);font-size:10.5px;color:var(--text-2);flex:1;overflow:hidden;white-space:nowrap;}
#topbar .status-ticker .tk{display:flex;align-items:center;gap:6px;}
#topbar .status-ticker .dot{width:6px;height:6px;border-radius:50%;background:var(--good);box-shadow:0 0 6px var(--good);}
#topbar .status-ticker .dot.amber{background:var(--amber);box-shadow:0 0 6px var(--amber);}
#topbar .status-ticker .dot.red{background:var(--red);box-shadow:0 0 6px var(--red);animation:pulse-red 1.4s infinite;}
@keyframes pulse-red{0%,100%{opacity:1;}50%{opacity:.35;}}
#topbar .clock{font-family:var(--font-mono);font-size:11px;color:var(--silver-2);letter-spacing:.06em;text-align:right;min-width:150px;}
#topbar .clock .d{color:var(--text-3);font-size:9px;letter-spacing:.1em;}
#body-wrap{flex:1;display:flex;min-height:0;}
#navrail{width:210px;flex:0 0 auto;border-right:1px solid var(--hairline);background:var(--panel-0);display:flex;flex-direction:column;padding:14px 0;overflow-y:auto;}
#navrail .nav-group-label{font-family:var(--font-mono);font-size:9px;letter-spacing:.16em;color:var(--text-3);padding:14px 18px 6px;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 18px;cursor:pointer;color:var(--text-2);border-left:2px solid transparent;font-size:12.5px;letter-spacing:.02em;transition:background .15s,color .15s,border-color .15s;}
.nav-item:hover{color:var(--text-1);background:rgba(255,255,255,0.02);}
.nav-item.active{color:var(--white);border-left-color:var(--silver-2);background:rgba(255,255,255,0.035);}
.nav-item .ni-idx{font-family:var(--font-mono);font-size:9.5px;color:var(--text-3);width:16px;}
.nav-item.active .ni-idx{color:var(--silver-2);}
#main{flex:1;min-width:0;overflow-y:auto;position:relative;}
.view{display:none;padding:22px 26px 60px;animation:fadeIn .35s ease;}
.view.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.view-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;border-bottom:1px solid var(--hairline);padding-bottom:14px;}
.view-header h1{font-family:var(--font-display);font-weight:500;font-size:24px;letter-spacing:.03em;color:var(--white);}
.view-header .vh-sub{font-family:var(--font-mono);font-size:10.5px;color:var(--text-3);letter-spacing:.08em;margin-top:4px;}
.view-header .vh-right{font-family:var(--font-mono);font-size:10px;color:var(--text-2);text-align:right;}
.panel{background:linear-gradient(180deg,var(--panel-1),var(--panel-0));border:1px solid var(--hairline);border-radius:var(--radius);position:relative;}
.panel::before{content:'';position:absolute;top:0;left:0;width:14px;height:14px;border-top:1px solid var(--hairline-strong);border-left:1px solid var(--hairline-strong);}
.panel::after{content:'';position:absolute;bottom:0;right:0;width:14px;height:14px;border-bottom:1px solid var(--hairline-strong);border-right:1px solid var(--hairline-strong);}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:1px solid var(--hairline);}
.panel-head h3{font-family:var(--font-display);font-weight:500;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--silver-2);}
.panel-head .ph-tag{font-family:var(--font-mono);font-size:9.5px;color:var(--text-3);}
.panel-body{padding:16px;}
.grid{display:grid;gap:14px;}
.g-4{grid-template-columns:repeat(4,1fr);} .g-3{grid-template-columns:repeat(3,1fr);} .g-2{grid-template-columns:repeat(2,1fr);}
.g-2-1{grid-template-columns:2fr 1fr;} .g-1-2{grid-template-columns:1fr 2fr;}
@media(max-width:1100px){.g-4{grid-template-columns:repeat(2,1fr);}.g-3{grid-template-columns:repeat(2,1fr);}.g-2-1,.g-1-2{grid-template-columns:1fr;}}
.kpi{padding:15px 16px;}
.kpi .kpi-label{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.12em;color:var(--text-3);text-transform:uppercase;}
.kpi .kpi-value{font-family:var(--font-display);font-size:30px;font-weight:500;color:var(--white);margin-top:8px;display:flex;align-items:baseline;gap:6px;}
.kpi .kpi-value .unit{font-family:var(--font-mono);font-size:12px;color:var(--text-2);font-weight:400;}
.kpi .kpi-delta{font-family:var(--font-mono);font-size:10px;color:var(--good);margin-top:6px;}
.kpi .kpi-delta.down{color:var(--red);}
.kpi .kpi-bar{height:3px;background:var(--panel-2);margin-top:10px;position:relative;overflow:hidden;}
.kpi .kpi-bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--silver-0),var(--silver-3));}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;padding:3px 9px;border:1px solid var(--hairline-strong);text-transform:uppercase;border-radius:20px;color:var(--text-2);}
.pill .dot{width:5px;height:5px;border-radius:50%;background:var(--good);}
.pill.warn .dot{background:var(--amber);} .pill.crit .dot{background:var(--red);}
.pill.warn{color:var(--amber);border-color:var(--amber-dim);} .pill.crit{color:var(--red);border-color:var(--red-dim);} .pill.good{color:var(--good);border-color:var(--good-dim);}
.btn{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;background:var(--panel-2);border:1px solid var(--hairline-strong);color:var(--text-1);padding:8px 14px;cursor:pointer;transition:all .15s;border-radius:var(--radius);}
.btn:hover{background:var(--panel-3);border-color:var(--silver-1);color:var(--white);}
.btn.primary{background:linear-gradient(135deg,var(--silver-1),var(--silver-0));color:#0a0a0a;border-color:var(--silver-2);font-weight:600;}
.btn.primary:hover{filter:brightness(1.15);}
.btn.small{padding:5px 10px;font-size:9.5px;}
select,input[type=text],input[type=number],input[type=range]{font-family:var(--font-mono);}
select,input[type=text],input[type=number]{background:var(--panel-2);border:1px solid var(--hairline-strong);color:var(--text-1);padding:7px 10px;font-size:11px;border-radius:var(--radius);outline:none;}
select:focus,input[type=text]:focus,input[type=number]:focus{border-color:var(--silver-1);}
table{width:100%;border-collapse:collapse;font-size:11.5px;}
th{text-align:left;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);padding:8px 10px;border-bottom:1px solid var(--hairline-strong);font-weight:400;}
td{padding:9px 10px;border-bottom:1px solid var(--hairline);color:var(--text-2);}
tr:hover td{background:rgba(255,255,255,0.015);color:var(--text-1);}
.scroll-y{overflow-y:auto;}
.alert-row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--hairline);}
.alert-row:last-child{border-bottom:none;}
.alert-row .a-sev{width:3px;align-self:stretch;background:var(--good);flex:0 0 auto;}
.alert-row.warn .a-sev{background:var(--amber);} .alert-row.crit .a-sev{background:var(--red);}
.alert-row .a-body{flex:1;} .alert-row .a-title{font-size:12px;color:var(--text-1);}
.alert-row .a-meta{font-family:var(--font-mono);font-size:9.5px;color:var(--text-3);margin-top:3px;}
.gauge{position:relative;display:flex;flex-direction:column;align-items:center;}
.gauge svg{transform:rotate(-90deg);}
.gauge .g-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-52%);text-align:center;}
.gauge .g-num .v{font-family:var(--font-display);font-size:26px;color:var(--white);font-weight:500;}
.gauge .g-num .l{font-family:var(--font-mono);font-size:8.5px;color:var(--text-3);letter-spacing:.1em;text-transform:uppercase;margin-top:2px;}
canvas{display:block;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.chip{font-family:var(--font-mono);font-size:10.5px;padding:7px 12px;border:1px solid var(--hairline-strong);color:var(--text-2);cursor:pointer;letter-spacing:.03em;border-radius:20px;transition:all .15s;}
.chip:hover{color:var(--text-1);border-color:var(--silver-1);}
.chip.active{background:var(--silver-2);color:#0a0a0a;border-color:var(--silver-2);font-weight:600;}
.sensor-item{display:grid;grid-template-columns:1fr auto 60px;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--hairline);}
.sensor-item:last-child{border-bottom:none;}
.sensor-item .s-name{font-size:11.5px;color:var(--text-1);} .sensor-item .s-name .u{color:var(--text-3);font-family:var(--font-mono);font-size:9.5px;margin-left:4px;}
.sensor-item .s-val{font-family:var(--font-mono);font-size:13px;color:var(--silver-2);text-align:right;min-width:70px;}
.sensor-item .s-bar{height:4px;background:var(--panel-2);position:relative;overflow:hidden;}
.sensor-item .s-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--silver-1);}
.sensor-item.warn .s-bar i{background:var(--amber);} .sensor-item.crit .s-bar i{background:var(--red);}
.sensor-item.warn .s-val{color:var(--amber);} .sensor-item.crit .s-val{color:var(--red);}
.stage-track{display:flex;align-items:center;margin:26px 0 10px;}
.stage-node{flex:1;text-align:center;position:relative;}
.stage-node .sn-dot{width:14px;height:14px;border-radius:50%;background:var(--panel-2);border:2px solid var(--hairline-strong);margin:0 auto 10px;position:relative;z-index:2;transition:all .3s;}
.stage-node .sn-line{position:absolute;top:6px;left:-50%;right:50%;height:2px;background:var(--hairline-strong);z-index:1;}
.stage-node:first-child .sn-line{display:none;}
.stage-node .sn-label{font-family:var(--font-mono);font-size:9.5px;color:var(--text-3);letter-spacing:.04em;}
.stage-node.done .sn-dot{background:var(--silver-1);border-color:var(--silver-2);} .stage-node.done .sn-line{background:var(--silver-1);} .stage-node.done .sn-label{color:var(--text-2);}
.stage-node.current .sn-dot{background:var(--amber);border-color:var(--amber);box-shadow:0 0 10px var(--amber);} .stage-node.current .sn-label{color:var(--amber);}
.stage-node.crit .sn-dot{background:var(--red);border-color:var(--red);box-shadow:0 0 10px var(--red);} .stage-node.crit .sn-label{color:var(--red);}
#depmap-svg{width:100%;height:520px;}
.dm-node-circle{fill:var(--panel-2);stroke:var(--hairline-strong);stroke-width:1.5;cursor:pointer;transition:all .2s;}
.dm-node-circle:hover{stroke:var(--silver-2);}
.dm-node-circle.impacted{stroke:var(--red);fill:rgba(182,72,72,0.18);} .dm-node-circle.selected{stroke:var(--silver-3);fill:var(--panel-3);}
.dm-edge{stroke:var(--hairline-strong);stroke-width:1.4;fill:none;} .dm-edge.impacted{stroke:var(--red);stroke-width:2;}
.dm-label{font-family:var(--font-mono);font-size:9.5px;fill:var(--text-2);text-anchor:middle;} .dm-sub{font-family:var(--font-mono);font-size:8px;fill:var(--text-3);text-anchor:middle;}
.heatmap{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;}
.heat-cell{aspect-ratio:1;border-radius:1px;cursor:pointer;position:relative;}
.heat-cell:hover::after{content:attr(data-tip);position:absolute;bottom:110%;left:50%;transform:translateX(-50%);background:var(--panel-3);border:1px solid var(--hairline-strong);padding:6px 8px;font-family:var(--font-mono);font-size:9px;white-space:nowrap;z-index:10;color:var(--text-1);}
#terminal-view{display:flex;flex-direction:column;height:calc(100vh - 56px - 44px);}
.term-window{flex:1;background:#000;border:1px solid var(--hairline-strong);padding:16px;font-family:var(--font-mono);font-size:12.5px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;}
.term-line{color:var(--text-2);white-space:pre-wrap;line-height:1.5;} .term-line.cmd{color:var(--silver-2);} .term-line.ok{color:var(--good);} .term-line.warn{color:var(--amber);} .term-line.err{color:var(--red);} .term-line.head{color:var(--white);}
.term-input-row{display:flex;align-items:center;gap:8px;border:1px solid var(--hairline-strong);border-top:none;background:#000;padding:10px 16px;}
.term-input-row .prompt{color:var(--silver-2);font-family:var(--font-mono);font-size:12.5px;}
.term-input-row input{flex:1;background:transparent;border:none;color:var(--text-1);font-family:var(--font-mono);font-size:12.5px;outline:none;}
.replay-controls{display:flex;align-items:center;gap:10px;}
.replay-controls .rc-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:1px solid var(--hairline-strong);background:var(--panel-2);cursor:pointer;color:var(--text-1);}
.replay-controls .rc-btn:hover{border-color:var(--silver-1);color:var(--white);} .replay-controls .rc-btn.active{background:var(--silver-2);color:#000;}
#replay-scrubber{flex:1;-webkit-appearance:none;height:3px;background:var(--panel-2);outline:none;}
#replay-scrubber::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;background:var(--silver-2);cursor:pointer;border-radius:50%;}
#report-modal{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;}
#report-modal.open{display:flex;}
.report-sheet{width:720px;max-height:85vh;overflow-y:auto;background:#0b0b0c;border:1px solid var(--hairline-strong);padding:0;}
.report-sheet .rs-head{padding:26px 34px 18px;border-bottom:2px solid var(--hairline-strong);display:flex;justify-content:space-between;align-items:flex-start;}
.report-sheet .rs-body{padding:26px 34px 34px;font-family:var(--font-mono);font-size:11.5px;color:var(--text-2);line-height:1.8;}
.report-sheet h4{font-family:var(--font-display);font-size:13px;letter-spacing:.1em;color:var(--silver-2);text-transform:uppercase;margin:22px 0 8px;border-bottom:1px solid var(--hairline);padding-bottom:6px;}
.report-sheet .rs-close{position:sticky;bottom:0;background:var(--panel-1);border-top:1px solid var(--hairline-strong);padding:14px 34px;display:flex;justify-content:flex-end;gap:10px;}
.wi-row{display:grid;grid-template-columns:160px 1fr 60px;align-items:center;gap:14px;padding:10px 0;}
.wi-row label{font-size:11.5px;color:var(--text-2);}
.wi-row input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel-2);}
.wi-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;background:var(--silver-2);border-radius:50%;cursor:pointer;}
.wi-row .wi-val{font-family:var(--font-mono);font-size:11px;color:var(--silver-2);text-align:right;}
.kb-card{padding:15px 16px;cursor:pointer;}
.kb-card .kb-cat{font-family:var(--font-mono);font-size:9px;color:var(--text-3);letter-spacing:.1em;text-transform:uppercase;}
.kb-card .kb-title{font-family:var(--font-display);font-size:14.5px;color:var(--text-1);margin:6px 0 8px;}
.kb-card .kb-desc{font-size:11.5px;color:var(--text-2);line-height:1.6;}
.exec-bignum{font-family:var(--font-display);font-size:46px;color:var(--white);font-weight:500;}
.exec-bignum .u{font-size:16px;color:var(--text-2);font-family:var(--font-mono);}
.badge-count{background:var(--red);color:#fff;font-family:var(--font-mono);font-size:9px;padding:1px 6px;border-radius:20px;margin-left:auto;}
.footer-note{text-align:center;padding:30px 0 10px;font-family:var(--font-mono);font-size:9.5px;color:var(--text-3);letter-spacing:.08em;}

/* ===== Hologram Viewer ===== */
.holo-stage{height:380px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:radial-gradient(ellipse 70% 60% at 50% 55%,rgba(255,255,255,0.05),transparent 70%);border:1px solid var(--hairline);}
.holo-stage::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,0.02) 0px,rgba(255,255,255,0.02) 1px,transparent 1px,transparent 3px);pointer-events:none;mix-blend-mode:screen;animation:holoScan 6s linear infinite;z-index:2;}
@keyframes holoScan{0%{background-position:0 0;}100%{background-position:0 60px;}}
#holo-canvas{width:100%;height:100%;display:block;position:relative;z-index:1;}
.holo-base{position:absolute;bottom:26px;width:230px;height:16px;border-radius:50%;background:radial-gradient(ellipse,rgba(236,238,241,0.2),transparent 70%);filter:blur(2px);pointer-events:none;z-index:0;}
.holo-label-tag{position:absolute;top:14px;left:14px;font-family:var(--font-mono);font-size:9px;letter-spacing:.14em;color:var(--text-3);text-transform:uppercase;z-index:3;}
.holo-label-tag i{color:var(--silver-2);font-style:normal;}
.holo-stat-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--hairline);font-size:11px;}
.holo-stat-row:last-child{border-bottom:none;}
.holo-stat-row .k{color:var(--text-2);}
.holo-stat-row .v{font-family:var(--font-mono);color:var(--silver-2);}
.holo-ref-note{font-family:var(--font-mono);font-size:10px;color:var(--text-2);line-height:1.7;padding:12px;background:var(--panel-2);border:1px solid var(--hairline);margin-top:10px;}
.holo-ref-note .src{color:var(--text-3);font-size:9px;display:block;margin-top:6px;}
@media(max-width:900px){#navrail{display:none;} .g-4,.g-3{grid-template-columns:repeat(2,1fr);}}

/* ===== C1-PMX/2 chip module ===== */
.c2x-wrap{background:transparent;padding:0;font-family:var(--font-mono);color:var(--text-1);}
.c2x-tabs{display:flex;gap:8px;margin-bottom:12px;}
.c2x-tab{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;background:var(--panel-2);border:1px solid var(--hairline-strong);color:var(--text-2);padding:7px 12px;cursor:pointer;}
.c2x-tab.active{background:var(--silver-2);color:#000;border-color:var(--silver-2);font-weight:700;}
.c2x-grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
@media(max-width:920px){.c2x-grid2{grid-template-columns:1fr;}}
.c2x-svgbox.hidden{display:none;}
.c2x-pin{stroke:var(--silver-0);stroke-width:2;transition:stroke .25s;} .c2x-pin.hot{stroke:var(--silver-2);}
.c2x-block{fill:var(--panel-2);stroke:#3a3b40;stroke-width:1.2;transition:stroke .3s;}
.c2x-block.active{stroke:var(--silver-2);} .c2x-block.warn{stroke:var(--amber);} .c2x-block.crit{stroke:var(--red);fill:#1a0f0f;}
.c2x-block-core{fill:var(--panel-3);stroke:var(--silver-2);stroke-width:1.4;}
.c2x-label{fill:var(--text-1);font-size:9.5px;font-weight:700;letter-spacing:.03em;}
.c2x-sub{fill:var(--text-3);font-size:7px;letter-spacing:.03em;}
.c2x-readout{fill:var(--silver-2);font-size:8.5px;font-weight:700;}
.c2x-trace{fill:none;stroke:#3a3b40;stroke-width:1.3;}
.c2x-trace.flow{stroke:var(--silver-2);stroke-dasharray:4 3;animation:c2flow .9s linear infinite;}
.c2x-trace.flow.warn{stroke:var(--amber);} .c2x-trace.flow.crit{stroke:var(--red);animation-duration:.35s;}
@keyframes c2flow{to{stroke-dashoffset:-14;}}
.c2x-pad{fill:var(--silver-0);transition:fill .25s;} .c2x-pad.hot{fill:var(--silver-2);}
.c2x-iso-stage{height:360px;display:flex;align-items:center;justify-content:center;perspective:1000px;}
.c2x-iso-box{position:relative;width:240px;height:160px;transform-style:preserve-3d;transform:rotateX(55deg) rotateZ(-38deg);transition:transform .1s;}
.c2x-iso-face{position:absolute;border:1px solid #3a3b40;background:linear-gradient(135deg,var(--panel-3),var(--panel-0));}
.c2x-iso-top{width:240px;height:160px;transform:translateZ(20px);display:flex;align-items:center;justify-content:center;flex-direction:column;}
.c2x-iso-top .t1{font-size:11px;letter-spacing:.08em;color:var(--text-1);font-weight:700;}
.c2x-iso-top .t2{font-size:7.5px;letter-spacing:.1em;color:var(--text-3);margin-top:4px;}
.c2x-iso-top .t3{margin-top:10px;font-size:9px;color:var(--silver-2);font-weight:700;}
.c2x-iso-front{width:240px;height:20px;bottom:0;transform-origin:bottom;transform:rotateX(-90deg);background:linear-gradient(var(--panel-0),#000);}
.c2x-iso-right{width:20px;height:160px;right:0;transform-origin:right;transform:rotateY(90deg);background:linear-gradient(90deg,var(--panel-0),#000);}
.c2x-iso-pin{position:absolute;width:5px;height:13px;background:var(--silver-0);transition:background .25s;}
.c2x-iso-pin.hot{background:var(--silver-2);box-shadow:0 0 6px var(--silver-2);}
.c2x-scope-row{display:grid;grid-template-columns:90px 1fr 56px;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--hairline);}
.c2x-scope-row:last-child{border-bottom:none;}
.c2x-scope-row .name{font-size:9.5px;color:var(--text-2);}
.c2x-scope-row canvas{width:100%;height:34px;display:block;}
.c2x-scope-row .rv{font-size:10px;text-align:right;color:var(--silver-2);}
.c2x-scope-row.warn .rv{color:var(--amber);} .c2x-scope-row.crit .rv{color:var(--red);}
.c2x-scope-row .rm{font-size:7px;color:var(--text-3);text-align:right;}
.c2x-form{display:grid;grid-template-columns:1fr 60px 70px auto;gap:6px;margin-bottom:10px;}
.c2x-chlist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.c2x-chip{font-size:9px;padding:4px 8px;border:1px solid var(--hairline-strong);color:var(--text-2);display:flex;gap:6px;align-items:center;}
.c2x-chip button{background:none;border:none;color:var(--red);cursor:pointer;font-size:10px;padding:0;}
.c2x-cascade{display:flex;align-items:center;justify-content:space-between;padding:10px 0;}
.c2x-cnode{flex:1;text-align:center;position:relative;}
.c2x-cnode .dot{width:16px;height:16px;border-radius:50%;background:var(--panel-2);border:2px solid #3a3b40;margin:0 auto 8px;transition:all .3s;}
.c2x-cnode .lbl{font-size:8px;letter-spacing:.05em;color:var(--text-3);}
.c2x-cnode .line{position:absolute;top:8px;left:-50%;right:50%;height:2px;background:#3a3b40;z-index:-1;}
.c2x-cnode:first-child .line{display:none;}
.c2x-cnode.on .dot{background:var(--amber);border-color:var(--amber);box-shadow:0 0 8px var(--amber);} .c2x-cnode.on .line{background:var(--amber);} .c2x-cnode.on .lbl{color:var(--amber);}
.c2x-cnode.crit .dot{background:var(--red);border-color:var(--red);box-shadow:0 0 8px var(--red);} .c2x-cnode.crit .line{background:var(--red);} .c2x-cnode.crit .lbl{color:var(--red);}
.c2x-out{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
.c2x-tile{border:1px solid var(--hairline-strong);padding:9px;text-align:center;}
.c2x-tile .n{font-size:17px;font-weight:700;color:var(--white);}
.c2x-tile.warn .n{color:var(--amber);} .c2x-tile.crit .n{color:var(--red);}
.c2x-tile .l{font-size:7px;letter-spacing:.08em;color:var(--text-3);margin-top:2px;text-transform:uppercase;}
.c2x-status{font-size:10px;letter-spacing:.04em;padding:8px 10px;border:1px solid var(--hairline-strong);color:var(--good);margin-bottom:12px;}
.c2x-status.warn{color:var(--amber);} .c2x-status.crit{color:var(--red);}
.c2x-log{height:110px;overflow-y:auto;font-size:9px;line-height:1.7;color:var(--text-3);}
.c2x-log .e{color:var(--text-2);} .c2x-log .e.warn{color:var(--amber);} .c2x-log .e.crit{color:var(--red);}
.c2x-btnrow{display:flex;gap:8px;margin-top:10px;}
</style>
</head>

function drawSpark(canvas,data,opts={}){
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const w=canvas.width=canvas.clientWidth*2, h=canvas.height=canvas.clientHeight*2;
  ctx.clearRect(0,0,w,h);
  const min=Math.min(...data), max=Math.max(...data), range=(max-min)||1, pad=6*2;
  ctx.beginPath();
  data.forEach((v,i)=>{ const x=pad+(w-pad*2)*(i/(data.length-1)); const y=h-pad-((v-min)/range)*(h-pad*2); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.strokeStyle=opts.color||'#c7c8cd'; ctx.lineWidth=opts.lw||3; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.stroke();
  if(opts.fill!==false){
    ctx.lineTo(w-pad,h-pad); ctx.lineTo(pad,h-pad); ctx.closePath();
    const grad=ctx.createLinearGradient(0,0,0,h);
    grad.addColorStop(0,(opts.color||'#c7c8cd')+'33'); grad.addColorStop(1,(opts.color||'#c7c8cd')+'00');
    ctx.fillStyle=grad; ctx.fill();
  }
}
function gaugeSVG(pct,color){

}

function twinSchematic(s){
  const nodes=DEPENDENCY_TEMPLATES[s.id]; const w=560,h=260,n=nodes.length; const step=(w-100)/(n-1);

  for(let i=0;i<n-1;i++){ const x1=50+i*step,x2=50+(i+1)*step,y=h/2; svg+=`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" class="dm-edge"/>`; }
  nodes.forEach((label,i)=>{
    const x=50+i*step,y=h/2,isCore=i===0;
    svg+=`<circle cx="${x}" cy="${y}" r="${isCore?26:18}" class="dm-node-circle ${isCore&&s.risk>60?'impacted':''}"/>`;
    svg+=`<text x="${x}" y="${y+38}" class="dm-label">${label}</text>`;
  });
  svg+=`</svg>`; return svg;
}

function drawDependencyMap(){
  const svg=document.getElementById('depmap-svg'); const cols=5;
  const colLabels=['Local Component','Subsystem','System','Operational Layer','Business Impact'];
  const rows=SYSTEMS.length; const colW=900/cols, rowH=560/(rows+1); let html='';
  colLabels.forEach((c,ci)=>{ html+=`<text x="${colW*ci+colW/2}" y="24" class="dm-label" style="fill:var(--text-3);font-size:9px;letter-spacing:.08em;">${c.toUpperCase()}</text>`; });
  const impactedId=selectedDepNode;
  SYSTEMS.forEach((s,ri)=>{
    const chain=DEPENDENCY_TEMPLATES[s.id]; const y=rowH*(ri+1)+10; const isSelectedRow=impactedId===s.id;
    for(let ci=0;ci<cols;ci++){ const x=colW*ci+colW/2; if(ci<cols-1){ const x2=colW*(ci+1)+colW/2; html+=`<line x1="${x}" y1="${y}" x2="${x2}" y2="${y}" class="dm-edge ${isSelectedRow?'impacted':''}"/>`; } }
    chain.forEach((label,ci)=>{ const x=colW*ci+colW/2; html+=`<circle cx="${x}" cy="${y}" r="12" class="dm-node-circle ${isSelectedRow?'impacted':''} ${isSelectedRow&&ci===0?'selected':''}" onclick="selectDepNode('${s.id}')"/><text x="${x}" y="${y+24}" class="dm-sub">${label}</text>`; });
  });
  svg.innerHTML=html;
}
function selectDepNode(id){
  selectedDepNode=id; const s=SYSTEMS.find(x=>x.id===id); const chain=DEPENDENCY_TEMPLATES[id];
  document.getElementById('dep-impact').innerHTML=`<div class="kpi-label">Origin System</div><div style="font-family:var(--font-display);font-size:18px;color:var(--white);margin:4px 0 14px;">${s.name}</div>
  ${chain.map((c,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--hairline);"><div class="mono" style="width:18px;color:var(--text-3);">${i+1}</div><div style="flex:1;font-size:12px;color:var(--text-1);">${c}</div><span class="pill ${i===0?riskLevel(s.risk):(s.risk>50?'warn':'good')}"><span class="dot"></span>${i===0?fmt(s.risk,0)+'%':(s.risk>50?'AT RISK':'STABLE')}</span></div>`).join('')}

  drawDependencyMap();
}

let replayState={playing:false,pos:0,speed:1,data:[]};
function buildReplayData(){ const data=[]; let v=8; for(let i=0;i<120;i++){ v=clamp(v+rnd(-1.5,3.2),0,100); if(i>90) v=clamp(v+rnd(1,4),0,100); data.push(v); } return data; }
function renderReplay(){
  const el=document.getElementById('content-replay'); const s=activeSystem();
  if(replayState.sysId!==s.id){ replayState.data=buildReplayData(); replayState.sysId=s.id; replayState.pos=0; }
  el.innerHTML=`
  <div class="panel" style="margin-bottom:14px;"><div class="panel-body"><div class="chip-row">${SYSTEMS.map(sy=>`<div class="chip ${sy.id===s.id?'active':''}" onclick="activeSystemId='${sy.id}'; renderReplay()">${sy.name}</div>`).join('')}<div class="chip" onclick="replayState.data=buildReplayData(); replayState.pos=0; renderReplay();">↻ NEW SYNTHETIC INCIDENT</div></div></div></div>
  <div class="panel"><div class="panel-head"><h3>Incident Playback — ${s.name}</h3><span class="ph-tag">SYNTHETIC INCIDENT #${uid().toUpperCase()}</span></div><div class="panel-body">
    <canvas id="replay-chart" style="width:100%;height:220px;"></canvas>
    <div style="margin-top:16px;" class="replay-controls"><div class="rc-btn" onclick="replayCmd('rewind')">⏮</div><div class="rc-btn ${replayState.playing?'active':''}" onclick="replayCmd('play')">${replayState.playing?'⏸':'▶'}</div><div class="rc-btn" onclick="replayCmd('accel')">⏩ ${replayState.speed}x</div><input type="range" id="replay-scrubber" min="0" max="${replayState.data.length-1}" value="${replayState.pos}" oninput="replayState.pos=+this.value; renderReplay();"><div class="mono" style="min-width:70px;text-align:right;">${replayState.pos}/${replayState.data.length-1}</div></div>
    <div class="mono" style="margin-top:14px;font-size:11px;color:var(--text-2);">Frame risk level: <strong style="color:var(--silver-2)">${fmt(replayState.data[replayState.pos],1)}%</strong>${replayState.pos>90?'<span style="color:var(--red)"> — CRITICAL ONSET DETECTED</span>':''}</div>
  </div></div>`;
  drawSpark(document.getElementById('replay-chart'),replayState.data.slice(0,Math.max(2,replayState.pos+1)),{color:replayState.data[replayState.pos]>60?'#b64848':'#c7c8cd'});
  document.getElementById('vhr-replay').textContent=replayState.playing?'PLAYING':'PAUSED';
}
function replayCmd(cmd){
  if(cmd==='rewind'){ replayState.pos=0; replayState.playing=false; }
  if(cmd==='play'){ replayState.playing=!replayState.playing; }
  if(cmd==='accel'){ replayState.speed=replayState.speed>=4?1:replayState.speed+1; }
  renderReplay();
}
setInterval(()=>{ if(replayState.playing&&currentView==='replay'){ replayState.pos+=replayState.speed; if(replayState.pos>=replayState.data.length-1){ replayState.pos=replayState.data.length-1; replayState.playing=false; } renderReplay(); } },450);

let reportHistory=[];
function generateReport(kind){
  const ts=new Date(); let title,body;
  if(kind==='exec'){ title='Executive Summary'; body=`SCOPE\nFleet-wide reliability posture across ${SYSTEMS.length} monitored environments.\n\nKEY METRICS\nAverage Fleet Risk: ${fmt(SYSTEMS.reduce((a,s)=>a+s.risk,0)/SYSTEMS.length,1)}%\nSystems in Critical State: ${SYSTEMS.filter(s=>s.risk>60).length}\nSystems in Advisory State: ${SYSTEMS.filter(s=>s.risk>25&&s.risk<=60).length}\n\nSUMMARY\nContinuumOne's predictive layer indicates a fleet operating within nominal-to-advisory bounds.\n\nFLAGGED SYSTEMS\n${SYSTEMS.filter(s=>s.risk>25).map(s=>`- ${s.name}: ${fmt(s.risk,1)}% risk, ${FAILURE_MODES[s.failure].name}`).join('\n')||'None currently flagged.'}`; }
  else if(kind==='reliability'){ title='Reliability Report'; body=`FLEET RELIABILITY BREAKDOWN\n\n${SYSTEMS.map(s=>`${s.name}\n  MTBF: ${fmt(s.mtbf,0)} hrs\n  MTTR: ${fmt(s.mttr,1)} hrs\n  Availability: ${fmt(s.availability,2)}%\n  Health Index: ${fmt(100-s.risk,0)}`).join('\n\n')}`; }
  else if(kind==='failure'){ title='Failure Analysis Report'; body=`ACTIVE FAILURE MODE ANALYSIS\n\n${SYSTEMS.map(s=>{ const fm=FAILURE_MODES[s.failure]; return `${s.name}\n  Failure Mode: ${fm.name}\n  Current Stage: ${fm.stages[s.stage]} (${s.stage+1}/${fm.stages.length})\n  Risk: ${fmt(s.risk,1)}%`; }).join('\n\n')}`; }
  else { title='Maintenance Report'; body=`PRIORITIZED MAINTENANCE ACTIONS\n\n${[...SYSTEMS].sort((a,b)=>b.risk-a.risk).map(s=>`${s.name} — ${s.risk>60?'IMMEDIATE':s.risk>25?'SCHEDULED':'ROUTINE'}\n  Confidence: ${fmt(clamp(70+s.risk*0.35,60,99),0)}%\n  Failure Mode: ${FAILURE_MODES[s.failure].name}`).join('\n\n')}`; }
  openReport(title,body); reportHistory.unshift({title,ts});
  const hist=document.getElementById('report-history');
  if(hist) hist.innerHTML=reportHistory.map(r=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--hairline);font-size:11.5px;"><span style="color:var(--text-1)">${r.title}</span><span class="mono" style="color:var(--text-3)">${r.ts.toLocaleTimeString()}</span></div>`).join('');
  pushAlert('good',`Report generated: ${title}`,'Report Generation System');
}
function openReport(title,body){
  document.getElementById('report-timestamp').textContent=title.toUpperCase()+' · GENERATED '+new Date().toUTCString();
  document.getElementById('report-body').innerHTML=`<h4>${title}</h4><div style="white-space:pre-wrap;">${body}</div>`;

    const blob=new Blob([`CONTINUUMONE // ${title.toUpperCase()}\nGenerated: ${new Date().toUTCString()}\n\n${body}`],{type:'text/plain'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`continuumone_${title.replace(/\s+/g,'_').toLowerCase()}.txt`; a.click();
  };
}

function termPrint(text,cls=''){ const w=document.getElementById('term-window'); const d=document.createElement('div'); d.className='term-line '+cls; d.textContent=text; w.appendChild(d); w.scrollTop=w.scrollHeight; }
function runTermCmd(raw){
  termPrint('c1@simulator:~$ '+raw,'cmd');
  const [cmd,...rest]=raw.toLowerCase().split(' '); const arg=rest.join(' ').trim(); const s=activeSystem();
  switch(cmd){
    case 'help': termPrint('AVAILABLE COMMANDS','head');
      termPrint('  health                  fleet-wide health summary');
      termPrint('  predict [system]        run predictive intelligence on a system');
      termPrint('  analyze [sensor]        analyze a sensor channel on the active system');
      termPrint('  simulate [failure]      inject a synthetic degradation event');
      termPrint('  dependencies            print dependency chain for active system');
      termPrint('  report                  generate an executive report');
      termPrint('  systems                 list all digital twin systems');
      termPrint('  use [system]            set active system');
      termPrint('  clear                   clear terminal'); break;
    case 'health': termPrint(`FLEET HEALTH — ${SYSTEMS.length} SYSTEMS MONITORED`,'head');
      SYSTEMS.forEach(sy=>termPrint(`  ${sy.name.padEnd(28)} risk=${fmt(sy.risk,1)}%  status=${riskLevel(sy.risk).toUpperCase()}`,riskLevel(sy.risk)==='crit'?'err':riskLevel(sy.risk)==='warn'?'warn':'ok')); break;
    case 'systems': SYSTEMS.forEach(sy=>termPrint(`  ${sy.id.padEnd(18)} ${sy.name}`)); break;
    case 'use': { const found=SYSTEMS.find(sy=>sy.id===arg||sy.name.toLowerCase()===arg); if(found){ activeSystemId=found.id; termPrint(`Active system set to ${found.name}`,'ok'); } else termPrint(`No system matching "${arg}". Try 'systems'.`,'err'); break; }
    case 'predict': { const target=arg?SYSTEMS.find(sy=>sy.id===arg||sy.name.toLowerCase()===arg):s; if(!target){ termPrint(`Unknown system "${arg}"`,'err'); break; }
      termPrint(`PREDICTIVE INTELLIGENCE — ${target.name}`,'head'); termPrint(`  Failure Probability   : ${fmt(target.risk,1)}%`); termPrint(`  Confidence Score      : ${fmt(target.confidence,1)}%`); termPrint(`  Time To Failure       : ${fmt(target.ttf/24,1)} days`); termPrint(`  Failure Mode          : ${FAILURE_MODES[target.failure].name}`); break; }
    case 'analyze': { const sn=s.sensors.find(x=>x.k.toLowerCase()===arg||x.name.toLowerCase()===arg); if(!sn){ termPrint(`Sensor "${arg}" not found on ${s.name}. Channels: ${s.sensors.map(x=>x.k).join(', ')}`,'err'); break; }
      termPrint(`SENSOR ANALYSIS — ${sn.name} (${s.name})`,'head'); termPrint(`  Current Value  : ${fmt(sn.value,2)} ${sn.unit}`); termPrint(`  Nominal Band   : ${sn.band[0]} – ${sn.band[1]} ${sn.unit}`); termPrint(`  Trend          : ${sn.history[sn.history.length-1]>sn.history[0]?'rising':'falling'}`); break; }
    case 'simulate': { const fmKey=Object.keys(FAILURE_MODES).find(k=>k===arg||FAILURE_MODES[k].name.toLowerCase().includes(arg)); s.simulating=true; if(fmKey) s.failure=fmKey;
      termPrint(`Injected synthetic degradation event on ${s.name} — model: ${FAILURE_MODES[s.failure].name}`,'warn'); pushAlert('warn',`Synthetic degradation event injected — ${s.name}`,'Terminal command'); break; }
    case 'dependencies': termPrint(`DEPENDENCY CHAIN — ${s.name}`,'head'); termPrint('  '+DEPENDENCY_TEMPLATES[s.id].join(' → ')); break;
    case 'report': termPrint('Generating executive report...','ok'); generateReport('exec'); break;
    case 'clear': document.getElementById('term-window').innerHTML=''; break;
    default: termPrint(`Command not recognized: "${cmd}". Type 'help'.`,'err');
  }
}

function initC1X(){
  document.querySelectorAll('.c2x-tab').forEach(t=>{
    t.addEventListener('click',()=>{
      document.querySelectorAll('.c2x-tab').forEach(x=>x.classList.remove('active')); t.classList.add('active');
      const v=t.dataset.view;
      document.getElementById('c2xSchem').classList.toggle('hidden',v!=='schem');
      document.getElementById('c2xIso').classList.toggle('hidden',v!=='iso');
    });
  });
  document.getElementById('ch-add').addEventListener('click',()=>{
    const name=document.getElementById('ch-name').value.trim(); const unit=document.getElementById('ch-unit').value.trim();
    const thresh=+document.getElementById('ch-thresh').value||65; if(!name) return;
    const base=rnd(10,25);
    c1xChannels.push({id:'ch_'+uid(),name,unit,thresh,value:base,base,noise:rnd(0.8,1.6),drift:0,history:new Array(60).fill(base)});
    document.getElementById('ch-name').value=''; document.getElementById('ch-unit').value='';
    rebuildC1X();
  });
  document.getElementById('c2x-fault').addEventListener('click',()=>{ c1xFaulting=true; c1xLog('Degradation event injected — synthetic fault propagation started','warn'); });
  document.getElementById('c2x-reset').addEventListener('click',()=>{
    c1xFaulting=false; c1xStage=0;
    c1xChannels.forEach(c=>{ c.value=c.base; c.drift=0; c.history=new Array(60).fill(c.base); });
    c1xLog('System reset to nominal baseline','ok');
  });
  const isoStage=document.getElementById('c2xIso');
  isoStage.addEventListener('mousemove',e=>{
    const r=isoStage.getBoundingClientRect();
    const rx=55+((e.clientY-r.top)/r.height-0.5)*10; const rz=-38+((e.clientX-r.left)/r.width-0.5)*14;
    const box=document.getElementById('isoBox'); if(box) box.style.transform=`rotateX(${rx}deg) rotateZ(${rz}deg)`;
  });
  rebuildC1X();
  c1xLog('C1-PMX/2 boot complete — channels calibrated','ok');
  setInterval(c1xTick,200);
}

  box.innerHTML=c1xChannels.map(c=>`<div class="c2x-chip">${c.name} (${c.unit||'–'})<button data-rm="${c.id}">×</button></div>`).join('');
  box.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{ c1xChannels=c1xChannels.filter(c=>c.id!==b.dataset.rm); rebuildC1X(); }));

  const leftPins=document.getElementById('c2x-pins-left'), leftTraces=document.getElementById('c2x-traces-left');
  let ph='',pt='';
  c1xChannels.forEach((c,i)=>{
    const y=90+i*30;
    ph+=`<line x1="80" y1="${y}" x2="140" y2="${y}" class="c2x-pin" id="pin-${c.id}"/><text x="76" y="${y-3}" text-anchor="end" class="c2x-sub" fill="#7a7c82">${c.name.toUpperCase().slice(0,10)}</text><circle cx="140" cy="${y}" r="2.2" class="c2x-pad" id="pad-${c.id}"/>`;
    pt+=`<path class="c2x-trace" id="tr-${c.id}" d="M140 ${y} H170 V${120+(i%3)*20}"/>`;
  });
  if(leftPins) leftPins.innerHTML=ph; if(leftTraces) leftTraces.innerHTML=pt;

  const scopeBox=document.getElementById('c2x-scopes');

function c1xLog(msg,cls){
  const log=document.getElementById('c2x-log'); if(!log) return;
  const div=document.createElement('div'); div.className='e '+(cls||''); div.textContent=`[${new Date().toLocaleTimeString()}] ${msg}`;
  log.prepend(div); while(log.children.length>40) log.removeChild(log.lastChild);
}
function drawC1XScope(canvas,history,color){
  if(!canvas) return; const ctx=canvas.getContext('2d');
  const w=canvas.width=canvas.clientWidth*2, h=canvas.height=canvas.clientHeight*2; ctx.clearRect(0,0,w,h);
  const min=Math.min(...history), max=Math.max(...history), range=(max-min)||1;
  ctx.beginPath(); history.forEach((v,i)=>{ const x=w*(i/(history.length-1)); const y=h-((v-min)/range)*h*0.85-h*0.08; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.strokeStyle=color; ctx.lineWidth=2.4; ctx.lineJoin='round'; ctx.stroke();
}
let c1xTickN=0;
function c1xTick(){
  if(currentView!=='chip') return;
  c1xTickN++;
  c1xChannels.forEach(c=>{
    const range=c.base*1.4+5;
    if(c1xFaulting) c.drift+=rnd(0.05,0.22);
    let nv=c.value+rnd(-1,1)*c.noise+c.drift-(c1xFaulting?0:(c.value-c.base)*0.05);
    nv=clamp(nv,0,range*1.6); c.value=nv; c.history.push(nv); c.history.shift();
    const devPct=clamp((nv/range)*100,0,100);
    const row=document.getElementById('scoperow-'+c.id);
    const state=devPct>c.thresh?'crit':devPct>c.thresh*0.6?'warn':'';
    if(row) row.className='c2x-scope-row'+(state?' '+state:'');
    const rv=document.getElementById('rv-'+c.id); if(rv) rv.textContent=nv.toFixed(1);
    drawC1XScope(document.getElementById('scope-'+c.id),c.history,state==='crit'?'#b64848':state==='warn'?'#c99a4a':'#c7c8cd');
    const pin=document.getElementById('pin-'+c.id), pad=document.getElementById('pad-'+c.id), tr=document.getElementById('tr-'+c.id), isop=document.getElementById('isopin-'+c.id);
    const hot=devPct>30;
    if(pin) pin.classList.toggle('hot',hot); if(pad) pad.classList.toggle('hot',hot); if(isop) isop.classList.toggle('hot',hot);
    if(tr){ tr.classList.remove('flow','warn','crit'); if(hot){ tr.classList.add('flow'); if(state) tr.classList.add(state); } }
  });
  const avgChannels=c1xChannels.reduce((a,c)=>a+clamp((c.value/(c.base*1.4+5))*100,0,100),0)/Math.max(1,c1xChannels.length);
  const risk=Math.round(clamp(avgChannels*0.9+(c1xFaulting?c1xStage*4:0),1,99));
  const conf=Math.round(clamp(72+risk*0.24,60,99));
  const ttf=Math.max(1,Math.round(60-risk*0.55));
  const state=risk>65?'crit':risk>35?'warn':'';
  if(c1xFaulting&&c1xTickN%14===0&&c1xStage<c1xStages.length-1){
    c1xStage++; c1xLog(`Stage advanced → ${c1xStages[c1xStage]}`,c1xStage===c1xStages.length-1?'crit':'warn');
    if(c1xStage===c1xStages.length-1) c1xLog('CRITICAL FAILURE THRESHOLD REACHED — auto-alert dispatched','crit');
  }
  ['blk-afe','blk-adc','blk-dsp','blk-ai'].forEach(id=>{ const e=document.getElementById(id); if(e){ e.classList.remove('active','warn','crit'); e.classList.add(state||'active'); } });
  ['blk-mcu','blk-decision'].forEach(id=>{ const e=document.getElementById(id); if(e){ e.classList.remove('active','warn','crit'); if(state) e.classList.add(state); } });
  const comm=document.getElementById('blk-comm'); if(comm) comm.classList.toggle('crit',state==='crit');
  ['tr1','tr2','tr3','tr4','tr5','tr6','tr7'].forEach(id=>{ const e=document.getElementById(id); if(e){ e.classList.remove('flow','warn','crit'); e.classList.add('flow'); if(state) e.classList.add(state); } });
  const tr8=document.getElementById('tr8'); if(tr8){ tr8.classList.remove('flow','warn','crit'); if(state){ tr8.classList.add('flow'); tr8.classList.add(state); } }
  const pinIrq=document.getElementById('pin-irq'); if(pinIrq) pinIrq.classList.toggle('hot',state==='crit');
  const padIrq=document.getElementById('pad-irq'); if(padIrq) padIrq.classList.toggle('hot',state==='crit');
  const setTxt=(id,v)=>{ const e=document.getElementById(id); if(e) e.textContent=v; };
  setTxt('txt-risk','RISK: '+risk+'%'); setTxt('txt-ttf','TTF: '+ttf+' d'); setTxt('txt-conf','CONF: '+conf+'%');
  setTxt('txt-stage','STAGE: '+c1xStages[c1xFaulting?c1xStage:0]);
  setTxt('txt-decision',state==='crit'?'ALERT: ACT NOW':state==='warn'?'SCHEDULE INSPECT':'MONITOR');
  setTxt('n-risk',risk+'%'); setTxt('n-conf',conf+'%'); setTxt('n-ttf',ttf); setTxt('n-stage',c1xStages[c1xFaulting?c1xStage:0]);
  ['tile-risk','tile-conf','tile-ttf','tile-stage'].forEach(id=>{ const e=document.getElementById(id); if(e){ e.classList.remove('warn','crit'); if(state) e.classList.add(state); } });
  const statusEl=document.getElementById('c2x-status');
  if(statusEl){ statusEl.classList.remove('warn','crit'); if(state) statusEl.classList.add(state);
    statusEl.textContent=state==='crit'?'CRITICAL — degradation signature matches learned failure model. Immediate action recommended.':state==='warn'?'ADVISORY — sensor deviation trending upward. Schedule inspection.':'SYSTEM NOMINAL — MONITORING';
  }
  const isoRisk=document.getElementById('iso-risk');
  if(isoRisk){ isoRisk.textContent='RISK '+risk+'%'; isoRisk.style.color=state==='crit'?'#b64848':state==='warn'?'#c99a4a':'#c7c8cd'; }
  const activeCount=c1xFaulting?Math.min(c1xCascadeNodes.length,1+Math.floor(c1xStage*0.9)):(risk>35?1:0);
  c1xCascadeNodes.forEach((n,i)=>{ const e=document.getElementById('casc-'+i); if(!e) return; e.classList.remove('on','crit'); if(i<activeCount) e.classList.add(i===c1xCascadeNodes.length-1&&state==='crit'?'crit':'on'); });
}

function simTick(){
  SYSTEMS.forEach(s=>{
    s.sensors.forEach(sn=>{
      const drift=s.simulating?(sn.band[1]-sn.base)*0.006:0;
      let nv=sn.value+rnd(-1,1)*sn.noise+drift;
      if(!s.simulating) nv+=(sn.base-sn.value)*0.03;
      nv=clamp(nv,sn.band[0]*0.85,sn.band[1]*1.1); sn.value=nv; sn.history.push(nv); sn.history.shift();
    });
    let devSum=0;
    s.sensors.forEach(sn=>{ const pct=clamp((sn.value-sn.band[0])/(sn.band[1]-sn.band[0]),0,1); devSum+=Math.max(0,pct-0.55)*2.2; });
    const target=clamp((devSum/s.sensors.length)*100+(s.simulating?s.stage*6:0),1,100);
    s.risk+=(target-s.risk)*0.08+rnd(-0.4,0.4); s.risk=clamp(s.risk,0.5,99);
    s.confidence=clamp(s.confidence+rnd(-0.3,0.3),82,99);
    s.ttf=clamp(1000-s.risk*9+rnd(-15,15),4,1400);
    s.mttr=clamp(s.mttr+rnd(-0.05,0.05),1.5,12);
    s.availability=clamp(100-s.risk*0.05+rnd(-0.02,0.02),90,99.99);
    if(s.simulating){
      s.stageProgress+=rnd(0.4,2.2); const maxStage=FAILURE_MODES[s.failure].stages.length-1;
      if(s.stageProgress>=100){ s.stageProgress=0;
        if(s.stage<maxStage){ s.stage++; pushAlert(s.stage===maxStage?'crit':'warn',`${s.name} entered stage: ${FAILURE_MODES[s.failure].stages[s.stage]}`,`Failure model: ${FAILURE_MODES[s.failure].name}`); }
        else { s.simulating=false; pushAlert('crit',`${s.name} reached CRITICAL FAILURE — simulation ended`,'Auto-reset scheduled'); setTimeout(()=>{ s.stage=0; s.risk=rnd(4,12); },4000); }
      }
    } else if(s.stage>0&&Math.random()<0.02){ s.stage=Math.max(0,s.stage-1); }
  });
  renderTicker();
  if(RENDER[currentView]) RENDER[currentView]();
}

function loadDLSample(){
  // Synthetic-but-realistic sample: gradually degrading bearing dataset (vibration, temp, current)
  let rows = [];
  let vib=1.1, temp=42, cur=18;
  for(let i=0;i<180;i++){
    const wear = Math.max(0, i-110)*0.018;
    vib = 1.1 + wear*1.4 + rnd(-0.08,0.08);
    temp = 42 + wear*9 + rnd(-0.6,0.6);
    cur = 18 + wear*3 + rnd(-0.3,0.3);
    rows.push([i, vib.toFixed(3), temp.toFixed(2), cur.toFixed(2)]);
  }
  dlDataset = { columns:['sample_index','vibration_mm_s','bearing_temp_c','motor_current_a'], rows, numericCols:[1,2,3] };
  document.getElementById('dl-filename').textContent = 'sample_bearing_degradation.csv (synthetic demo set)';
  runDLAnalysis();

  pushAlert('good','Sample dataset loaded','180 rows · bearing degradation profile');

function parseDLCSV(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length>0);
  if(lines.length<3) throw new Error('File too short — need a header row plus at least a few data rows');
  const columns = lines[0].split(',').map(s=>s.trim());
  const rows = lines.slice(1).map(l=>l.split(',').map(s=>s.trim()));
  // detect numeric columns (majority of values parse as numbers)
  const numericCols = [];
  for(let c=0;c<columns.length;c++){
    let numCount=0;
    for(let r=0;r<Math.min(rows.length,40);r++){ if(rows[r][c]!==undefined && !isNaN(parseFloat(rows[r][c])) && rows[r][c]!=='') numCount++; }
    if(numCount > Math.min(rows.length,40)*0.7) numericCols.push(c);
  }
  if(numericCols.length===0) throw new Error('No numeric columns detected in this file');
  dlDataset = { columns, rows, numericCols };
}

function linregSlope(ys){
  const n=ys.length; const xs=ys.map((_,i)=>i);
  const xMean=xs.reduce((a,b)=>a+b,0)/n, yMean=ys.reduce((a,b)=>a+b,0)/n;
  let num=0, den=0;
  for(let i=0;i<n;i++){ num += (xs[i]-xMean)*(ys[i]-yMean); den += (xs[i]-xMean)**2; }
  const slope = den===0?0:num/den;
  const intercept = yMean - slope*xMean;
  return {slope, intercept};
}
function mean(a){ return a.reduce((x,y)=>x+y,0)/a.length; }
function stdev(a){ const m=mean(a); return Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/Math.max(1,a.length-1)); }

function runDLAnalysis(){
  const {columns, rows, numericCols} = dlDataset;
  const channels = numericCols.map(ci=>{
    const name = columns[ci];
    const series = rows.map(r=>parseFloat(r[ci])).filter(v=>!isNaN(v));
    const m = mean(series), sd = stdev(series)||1e-6;
    // rolling z-score (window 12) — real computation, flags points >2.5 sigma from local rolling baseline
    const win = Math.max(5, Math.floor(series.length*0.08));
    const zscores = series.map((v,i)=>{
      const lo=Math.max(0,i-win), slice=series.slice(lo,i+1);
      const lm=mean(slice), ls=stdev(slice)||1e-6;
      return (v-lm)/ls;
    });
    const anomalies = zscores.map((z,i)=>({i, z, value:series[i]})).filter(p=>Math.abs(p.z)>2.5);
    const {slope, intercept} = linregSlope(series);
    const trendPctOverSeries = series.length>1 ? ((slope*(series.length-1))/ (m||1))*100 : 0;
    // simple RUL heuristic: if trending up, estimate steps until value crosses (mean + 3*sd) from current trend
    const upperBound = m + 3*sd;
    let stepsToThreshold = null;
    if(slope>0){
      const last = series[series.length-1];
      if(last < upperBound){ stepsToThreshold = Math.round((upperBound-last)/slope); }
      else stepsToThreshold = 0;
    }
    return { name, series, zscores, anomalies, slope, intercept, mean:m, sd, trendPctOverSeries, stepsToThreshold, upperBound };
  });

  // composite risk: weighted by (recent anomaly density + normalized trend steepness), explainable per-channel
  const contributions = channels.map(c=>{
    const anomalyDensity = c.anomalies.length / c.series.length; // 0..1
    const normTrend = clamp(Math.abs(c.trendPctOverSeries)/40, 0, 1); // heuristic normalization
    const score = clamp(anomalyDensity*0.6 + normTrend*0.4, 0, 1);
    return { name:c.name, score, anomalyDensity, trendPct:c.trendPctOverSeries };
  });
  const totalScore = contributions.reduce((a,c)=>a+c.score,0) || 1e-9;
  contributions.forEach(c=> c.share = c.score/totalScore);
  const compositeRisk = clamp(contributions.reduce((a,c)=>a+c.score,0)/contributions.length*100, 0, 99);

  dlResults = { channels, contributions, compositeRisk };
}

            <tr><td>Trend (least-squares slope)</td><td style="color:var(--text-1)">${c.slope>=0?'+':''}${fmt(c.slope,4)} /step (${fmt(c.trendPctOverSeries,1)}% over series)</td></tr>
            <tr><td>Anomalous Points (|z|&gt;2.5)</td><td style="color:${c.anomalies.length?'var(--amber)':'var(--text-1)'}">${c.anomalies.length} of ${c.series.length}</td></tr>
            <tr><td>Est. Steps to +3σ Threshold</td><td style="color:${c.stepsToThreshold===null?'var(--text-1)':c.stepsToThreshold<20?'var(--red)':'var(--text-1)'}">${c.stepsToThreshold===null?'Not trending upward':c.stepsToThreshold+' steps'}</td></tr>

  channels.forEach((c,idx)=>{

  channels.forEach(c=>{
    lines.push('  '+c.name);
    lines.push('    mean='+fmt(c.mean,4)+' sd='+fmt(c.sd,4)+' slope='+fmt(c.slope,5)+'/step');
    lines.push('    anomalies='+c.anomalies.length+'/'+c.series.length+'  est_steps_to_3sigma='+(c.stepsToThreshold===null?'n/a':c.stepsToThreshold));
  });
  const blob = new Blob([lines.join('\n')], {type:'text/plain'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'continuumone_datalab_analysis.txt'; a.click();
  pushAlert('good','Data Lab analysis exported','continuumone_datalab_analysis.txt');
}

/* ---------- Three.js wireframe engine ---------- */
function teardownHolo(){
  if(holo3D.raf) cancelAnimationFrame(holo3D.raf);
  if(holo3D.resizeObs) holo3D.resizeObs.disconnect();
  if(holo3D.renderer) holo3D.renderer.dispose();
  holo3D = { renderer:null, scene:null, camera:null, group:null, spinExtra:null, raf:null, resizeObs:null };
}
function wireMat(opacity){ return new THREE.LineBasicMaterial({color:0xeceef1, transparent:true, opacity: opacity!==undefined?opacity:0.85}); }
function addWireMesh(group, geometry, opacity){
  const edges = new THREE.EdgesGeometry(geometry);
  const line = new THREE.LineSegments(edges, wireMat(opacity));
  group.add(line);
  return line;
}

function initHoloScene(model){
  teardownHolo();
  if(typeof THREE === 'undefined'){
    document.getElementById('holo-stage-el').innerHTML = '<div class="mono" style="color:var(--text-3);font-size:11px;padding:20px;">3D engine failed to load — check network access to the Three.js CDN.</div>';
    return;
  }
  const canvas = document.getElementById('holo-canvas');
  const stage = document.getElementById('holo-stage-el');
  const w = stage.clientWidth, h = stage.clientHeight;

  const renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.setSize(w, h, false);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(36, w/h, 0.1, 100);
  camera.position.set(0, 1.4, 8);
  camera.lookAt(0, 0.4, 0);

  const grid = new THREE.GridHelper(6, 16, 0xeceef1, 0xeceef1);
  grid.material.transparent = true; grid.material.opacity = 0.10;
  grid.position.y = -1.6;
  scene.add(grid);

  const group = new THREE.Group();
  scene.add(group);
  const spinExtra = buildHoloModel(model.id, group);

  holo3D = { renderer, scene, camera, group, spinExtra, raf:null, resizeObs:null };

  let t = 0;
  function animate(){
    t += 0.01;
    group.rotation.y += 0.006;
    group.position.y = Math.sin(t*0.6)*0.06;
    if(spinExtra && spinExtra.blades) spinExtra.blades.rotation.z += spinExtra.bladeSpeed || 0.12;
    if(spinExtra && spinExtra.armSwing){ spinExtra.armSwing.rotation.z = Math.sin(t*0.5)*0.18; }
    renderer.render(scene, camera);
    holo3D.raf = requestAnimationFrame(animate);
  }
  animate();

  const ro = new ResizeObserver(()=>{
    const nw = stage.clientWidth, nh = stage.clientHeight;
    if(nw<10||nh<10) return;
    renderer.setSize(nw, nh, false);
    camera.aspect = nw/nh; camera.updateProjectionMatrix();
  });
  ro.observe(stage);
  holo3D.resizeObs = ro;
}

function buildHoloModel(id, group){
  switch(id){
    case 'turbofan': return buildTurbofan(group);
    case 'merlin': return buildRocketEngine(group);
    case 'windturbine': return buildWindTurbine(group);
    case 'bigboy': return buildSteamLocomotive(group);
    case 'irb6700': return buildRobotArm(group);
    case 'rtflex96c': return buildInlineMarineDiesel(group);
    case 'ge9ha': return buildGasTurbine(group);
    case 'w16': return buildW16Engine(group);
    case 'emd710': return buildV16Locomotive(group);
    case 'f1pu': return buildF1PowerUnit(group);
    default: return null;
  }
}

function buildTurbofan(group){
  const nacelle = new THREE.CylinderGeometry(1.05, 1.05, 2.6, 24, 1, true);
  nacelle.rotateZ(Math.PI/2);
  addWireMesh(group, nacelle, 0.85);
  const inlet = new THREE.TorusGeometry(1.06, 0.03, 8, 32);
  inlet.rotateY(Math.PI/2); inlet.translate(-1.3,0,0);
  addWireMesh(group, inlet, 0.7);
  const bladeGroup = new THREE.Group();
  for(let i=0;i<16;i++){
    const blade = new THREE.BoxGeometry(0.05, 0.85, 0.14);
    blade.translate(0, 0.55, 0);
    const edges = new THREE.EdgesGeometry(blade);
    const line = new THREE.LineSegments(edges, wireMat(0.6));
    line.rotation.x = (i/16)*Math.PI*2;
    line.position.x = -1.28;
    bladeGroup.add(line);
  }
  group.add(bladeGroup);
  const hub = new THREE.SphereGeometry(0.22,10,8);
  hub.translate(-1.3,0,0);
  addWireMesh(group, hub, 0.55);
  group.rotation.z = 0.05;
  return { blades: bladeGroup, bladeSpeed: 0.35 };
}

function buildRocketEngine(group){
  const bell = new THREE.CylinderGeometry(0.42, 1.15, 2.1, 20, 4, true);
  bell.translate(0,-0.4,0);
  addWireMesh(group, bell, 0.85);
  const head = new THREE.CylinderGeometry(0.42, 0.42, 0.5, 16, 1, true);
  head.translate(0, 0.9, 0);
  addWireMesh(group, head, 0.7);
  for(let i=0;i<3;i++){
    const ring = new THREE.TorusGeometry(0.5 + i*0.22, 0.02, 6, 28);
    ring.rotateX(Math.PI/2);
    ring.translate(0, -0.5 - i*0.55, 0);
    addWireMesh(group, ring, 0.4);
  }
  const pump = new THREE.BoxGeometry(0.5,0.4,0.5);
  pump.translate(0.6, 1.0, 0);
  addWireMesh(group, pump, 0.5);
  group.position.y = 0.4;
  return null;
}

function buildWindTurbine(group){
  const tower = new THREE.CylinderGeometry(0.09, 0.16, 3.6, 12, 1, true);
  tower.translate(0,-1.2,0);
  addWireMesh(group, tower, 0.75);
  const nacelle = new THREE.BoxGeometry(0.7,0.28,0.28);
  nacelle.translate(0, 0.62, 0);
  addWireMesh(group, nacelle, 0.75);
  const bladeGroup = new THREE.Group();
  for(let i=0;i<3;i++){
    const blade = new THREE.BoxGeometry(0.09, 1.7, 0.03);
    blade.translate(0, 0.9, 0);
    const taper = new THREE.EdgesGeometry(blade);
    const line = new THREE.LineSegments(taper, wireMat(0.7));
    line.rotation.z = (i/3)*Math.PI*2;
    bladeGroup.add(line);
  }
  bladeGroup.position.set(0.42, 0.62, 0);
  bladeGroup.rotation.y = Math.PI/2 * 0.15;
  group.add(bladeGroup);
  group.rotation.x = -0.02;
  return { blades: bladeGroup, bladeSpeed: 0.12 };
}

function buildSteamLocomotive(group){
  const boiler = new THREE.CylinderGeometry(0.55,0.55,3.4,20,1,true);
  boiler.rotateZ(Math.PI/2);
  addWireMesh(group, boiler, 0.85);
  const stack = new THREE.CylinderGeometry(0.16,0.2,0.55,10,1,true);
  stack.translate(-1.0, 0.75, 0);
  addWireMesh(group, stack, 0.65);
  const cab = new THREE.BoxGeometry(0.75,0.85,0.95);
  cab.translate(1.35, 0.15, 0);
  addWireMesh(group, cab, 0.65);
  const wheelGroup = new THREE.Group();
  const wheelPositions = [-1.4,-0.85,-0.3,0.3,0.85];
  wheelPositions.forEach(x=>{
    const wheel = new THREE.TorusGeometry(0.42, 0.05, 8, 24);
    wheel.rotateY(Math.PI/2);
    wheel.translate(x, -0.55, 0);
    addWireMesh(wheelGroup, wheel, 0.6);
  });
  group.add(wheelGroup);
  return { blades: wheelGroup, bladeSpeed: 0 };
}

function buildRobotArm(group){
  const base = new THREE.CylinderGeometry(0.5,0.55,0.35,16);
  base.translate(0,-1.1,0);
  addWireMesh(group, base, 0.8);
  const col = new THREE.CylinderGeometry(0.22,0.26,0.7,12);
  col.translate(0,-0.55,0);
  addWireMesh(group, col, 0.75);
  const armPivot = new THREE.Group();
  armPivot.position.set(0,-0.2,0);
  const seg1 = new THREE.BoxGeometry(0.24,1.4,0.24);
  seg1.translate(0,0.6,0);
  addWireMesh(armPivot, seg1, 0.8);
  group.add(armPivot);

  const armSwing = new THREE.Group();
  armSwing.position.set(0,1.25,0);
  const seg2 = new THREE.BoxGeometry(0.2,1.1,0.2);
  seg2.translate(0,0.5,0.15);
  const edges2 = new THREE.EdgesGeometry(seg2);
  armSwing.add(new THREE.LineSegments(edges2, wireMat(0.75)));
  const wrist = new THREE.BoxGeometry(0.24,0.18,0.3);
  const edgesW = new THREE.EdgesGeometry(wrist);
  const wristMesh = new THREE.LineSegments(edgesW, wireMat(0.65));
  wristMesh.position.set(0,1.05,0.15);
  armSwing.add(wristMesh);
  armPivot.add(armSwing);

  return { blades:null, bladeSpeed:0, armSwing };
}

function buildInlineMarineDiesel(group){
  const bed = new THREE.BoxGeometry(4.0,0.35,0.55);
  addWireMesh(group, bed, 0.85);
  for(let i=0;i<14;i++){
    const x = -1.85 + i*(3.7/13);
    const cyl = new THREE.CylinderGeometry(0.12,0.12,0.9,10,1,true);
    cyl.translate(x, 0.6, 0);
    addWireMesh(group, cyl, i%3===0?0.75:0.4);
  }
  const manifold = new THREE.CylinderGeometry(0.06,0.06,3.9,8,1,true);
  manifold.rotateZ(Math.PI/2);
  manifold.translate(0,1.05,0.25);
  addWireMesh(group, manifold, 0.4);
  group.rotation.x = -0.05;
  return null;
}

function buildGasTurbine(group){
  const housing = new THREE.CylinderGeometry(0.62,0.62,3.0,22,1,true);
  housing.rotateZ(Math.PI/2);
  addWireMesh(group, housing, 0.85);
  const intake = new THREE.ConeGeometry(0.62,0.6,20,1,true);
  intake.rotateZ(Math.PI/2);
  intake.translate(-1.8,0,0);
  addWireMesh(group, intake, 0.6);
  for(let i=0;i<7;i++){
    const ring = new THREE.TorusGeometry(0.63,0.015,6,28);
    ring.rotateY(Math.PI/2);
    ring.translate(-1.3 + i*0.42,0,0);
    addWireMesh(group, ring, 0.35);
  }
  const exhaustCone = new THREE.ConeGeometry(0.5,0.7,18,1,true);
  exhaustCone.rotateZ(-Math.PI/2);
  exhaustCone.translate(1.85,0,0);
  addWireMesh(group, exhaustCone, 0.55);
  return null;
}

function buildW16Engine(group){
  const crank = new THREE.CylinderGeometry(0.14,0.14,2.0,10,1,true);
  crank.rotateZ(Math.PI/2);
  addWireMesh(group, crank, 0.7);
  const angles = [ -0.55, -0.2, 0.2, 0.55 ];
  angles.forEach((ang,bankIdx)=>{
    for(let i=0;i<4;i++){
      const x = -0.75 + i*0.5;
      const cyl = new THREE.CylinderGeometry(0.09,0.09,0.7,8,1,true);
      cyl.translate(x, 0.5, 0);
      cyl.rotateX(ang);
      addWireMesh(group, cyl, 0.7);
    }
  });
  const turbo1 = new THREE.SphereGeometry(0.18,10,8); turbo1.translate(-1.1,-0.1,0.4);
  const turbo2 = new THREE.SphereGeometry(0.18,10,8); turbo2.translate(1.1,-0.1,0.4);
  addWireMesh(group, turbo1, 0.5);
  addWireMesh(group, turbo2, 0.5);
  return null;
}

function buildV16Locomotive(group){
  const block = new THREE.BoxGeometry(2.6,0.5,0.7);
  addWireMesh(group, block, 0.8);
  const perBank = 8, bankLen = 2.2;
  for(let bank=0;bank<2;bank++){
    const angle = bank===0 ? -0.5 : 0.5;
    for(let i=0;i<perBank;i++){
      const x = -1.1 + i*(bankLen/(perBank-1));
      const cyl = new THREE.CylinderGeometry(0.1,0.1,0.75,8,1,true);
      cyl.translate(x,0.5,0);
      cyl.rotateX(angle);
      addWireMesh(group, cyl, 0.65);
    }
  }
  const wheelGroup = new THREE.Group();
  [-1.3,1.3].forEach(x=>{
    const wheel = new THREE.TorusGeometry(0.35,0.045,8,22);
    wheel.rotateY(Math.PI/2);
    wheel.translate(x,-0.55,0);
    addWireMesh(wheelGroup, wheel, 0.55);
  });
  group.add(wheelGroup);
  return { blades: wheelGroup, bladeSpeed: 0.05 };
}

function buildF1PowerUnit(group){
  const crank = new THREE.CylinderGeometry(0.1,0.1,1.1,10,1,true);
  crank.rotateZ(Math.PI/2);
  addWireMesh(group, crank, 0.75);
  [-0.35,0,0.35].forEach(x=>{
    [ -0.5, 0.5 ].forEach(angSign=>{
      const cyl = new THREE.CylinderGeometry(0.075,0.075,0.55,8,1,true);
      cyl.translate(x,0.38,0);
      cyl.rotateX(angSign*0.55);
      addWireMesh(group, cyl, 0.75);
    });
  });
  const turbo = new THREE.SphereGeometry(0.14,10,8);
  turbo.translate(0.75,-0.05,0.05);
  addWireMesh(group, turbo, 0.55);
  const mguBox = new THREE.BoxGeometry(0.28,0.2,0.32);
  mguBox.translate(-0.75,-0.05,0.1);
  addWireMesh(group, mguBox, 0.55);
  return null;
}

let presenterActive = false, presenterIdx = 0, presenterTimer = null;

function buildPresenterUI(){
  const btn = document.createElement('div');
  btn.id = 'presenter-toggle';
  btn.className = 'tk';
  btn.style.cursor = 'pointer';
  btn.style.marginLeft = 'auto';
  btn.innerHTML = `<span class="dot good"></span><span id="presenter-label">PRESENTER MODE</span>`;
  btn.addEventListener('click', togglePresenter);
  document.getElementById('status-ticker').insertAdjacentElement('afterend', wrapPresenterBtn(btn));
}
function wrapPresenterBtn(btn){
  const holder = document.createElement('div');
  holder.style.display='flex'; holder.style.alignItems='center'; holder.style.paddingLeft='16px'; holder.style.borderLeft='1px solid var(--hairline)';
  holder.appendChild(btn);
  return holder;
}
function togglePresenter(){
  presenterActive = !presenterActive;
  const label = document.getElementById('presenter-label');
  if(presenterActive){
    label.textContent = 'PRESENTER MODE: ON (ESC TO STOP)';
    presenterIdx = 0;
    runPresenterStep();
  } else {
    label.textContent = 'PRESENTER MODE';
    clearTimeout(presenterTimer);
    removePresenterCaption();
  }
}
function runPresenterStep(){
  if(!presenterActive) return;
  const step = PRESENTER_SCRIPT[presenterIdx % PRESENTER_SCRIPT.length];
  switchView(step.view);
  showPresenterCaption(step.caption, presenterIdx+1, PRESENTER_SCRIPT.length);
  presenterIdx++;
  presenterTimer = setTimeout(runPresenterStep, 6000);
}
function showPresenterCaption(text, n, total){
  removePresenterCaption();
  const cap = document.createElement('div');
  cap.id = 'presenter-caption';
  cap.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:400;background:rgba(10,10,12,0.95);border:1px solid var(--hairline-strong);padding:14px 22px;font-family:var(--font-mono);font-size:12px;color:var(--text-1);max-width:640px;text-align:center;backdrop-filter:blur(6px);';
  cap.innerHTML = `<div style="font-size:9px;color:var(--text-3);letter-spacing:.1em;margin-bottom:6px;">STEP ${n} / ${total}</div>${text}`;
  document.body.appendChild(cap);
}
