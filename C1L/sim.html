<script>
/* ==========================================================================
   ContinuumOne Application Controller & Event Handler Architecture
   ========================================================================== */
document.addEventListener('DOMContentLoaded', () => {
  let selectedAsset = AssetCatalog[0];
  let currentParams = { ...selectedAsset.defaultParams };
  let activeCategory = 'ALL';
  let activeTab = 'tab-dossier';
  let scopeScopeOscilloscope = null;

  // Real-time UTC Clock Script
  setInterval(() => {
    const now = new Date();
    document.getElementById('utc-clock').innerText = now.toUTCString().split(' ')[4] + ' UTC';
  }, 1000);

  // Render Sidebar Asset List
  function renderAssetList() {
    const container = document.getElementById('asset-list-container');
    const searchVal = document.getElementById('asset-search').value.toLowerCase();
    container.innerHTML = '';

    const filtered = AssetCatalog.filter(a => {
      const matchCat = activeCategory === 'ALL' || a.category === activeCategory;
      const matchSearch = a.name.toLowerCase().includes(searchVal) || a.manufacturer.toLowerCase().includes(searchVal);
      return matchCat && matchSearch;
    });

    document.getElementById('asset-count').innerText = filtered.length;

    filtered.forEach(asset => {
      const card = document.createElement('div');
      card.className = `asset-card ${asset.id === selectedAsset.id ? 'selected' : ''}`;
      
      // Calculate Quick Initial Risk Level
      const initialSim = SimulationEngine.analyze(asset, asset.defaultParams);
      const riskClass = initialSim.riskLevel === 'EXTREME' ? 'risk-extreme' : (initialSim.riskLevel === 'MEDIUM' ? 'risk-medium' : 'risk-low');

      card.innerHTML = `
        <div class="asset-card-header">
          <div class="asset-card-title">${asset.name}</div>
          <span class="risk-badge ${riskClass}">${initialSim.riskLevel}</span>
        </div>
        <div class="asset-card-meta">
          <span>${asset.manufacturer}</span>
          <span>${asset.category}</span>
        </div>
      `;

      card.addEventListener('click', () => {
        selectedAsset = asset;
        currentParams = { ...asset.defaultParams };
        renderAssetList();
        renderActiveTab();
      });

      container.appendChild(card);
    });
  }

  // Filter Event Listeners
  document.getElementById('category-filters').addEventListener('click', (e) => {
    if (e.target.classList.contains('filter-chip')) {
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      e.target.classList.add('active');
      activeCategory = e.target.dataset.cat;
      renderAssetList();
    }
  });

  document.getElementById('asset-search').addEventListener('input', renderAssetList);

  // Tab Switching
  document.querySelectorAll('.nav-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      activeTab = tab.dataset.target;
      renderActiveTab();
    });
  });

  // Render Active Tab Workspace View
  function renderActiveTab() {
    const mainArea = document.getElementById('main-content-area');
    const simResult = SimulationEngine.analyze(selectedAsset, currentParams);

    if (activeTab === 'tab-dossier') {
      mainArea.innerHTML = `
        <div class="panel">
          <div class="panel-header">
            <span class="panel-title">Asset Dossier Overview</span>
            <span class="risk-badge ${simResult.riskLevel === 'EXTREME' ? 'risk-extreme' : 'risk-low'}">${selectedAsset.id}</span>
          </div>
          <h2 style="font-size:20px; color:#fff; margin-bottom:8px;">${selectedAsset.name}</h2>
          <p style="color:var(--text-muted); margin-bottom:16px;">${selectedAsset.desc}</p>

          <table style="width:100%; text-align:left; font-family:var(--font-mono); font-size:12px; border-collapse:collapse;">
            <tr style="border-bottom:1px solid var(--border-subtle);"><td style="padding:8px 0; color:var(--text-muted);">Manufacturer:</td><td style="color:#fff;">${selectedAsset.manufacturer}</td></tr>
            <tr style="border-bottom:1px solid var(--border-subtle);"><td style="padding:8px 0; color:var(--text-muted);">Model:</td><td style="color:#fff;">${selectedAsset.model}</td></tr>
            <tr style="border-bottom:1px solid var(--border-subtle);"><td style="padding:8px 0; color:var(--text-muted);">Design Lifespan:</td><td style="color:#fff;">${selectedAsset.operatingLife}</td></tr>
            <tr style="border-bottom:1px solid var(--border-subtle);"><td style="padding:8px 0; color:var(--text-muted);">Criticality Level:</td><td style="color:#fff;">${selectedAsset.criticality}</td></tr>
            <tr><td style="padding:8px 0; color:var(--text-muted);">Architecture:</td><td style="color:#fff;">${selectedAsset.systemType}</td></tr>
          </table>
        </div>

        <div class="panel">
          <div class="panel-header">
            <span class="panel-title">Known Failure Modes</span>
          </div>
          <ul style="list-style:none; font-family:var(--font-mono); font-size:12px; display:flex; flex-direction:column; gap:8px;">
            ${selectedAsset.failureModes.map(fm => `
              <li style="background:var(--bg-tertiary); padding:10px; border:1px solid var(--border-subtle); display:flex; align-items:center; gap:10px;">
                <span style="color:var(--status-amber);">⚠</span> ${fm}
              </li>
            `).join('')}
          </ul>
          <div style="margin-top:auto; padding-top:16px;">
            <button class="c1-btn c1-btn-primary" id="go-to-sim-btn" style="width:100%;">Initialize Simulation Control →</button>
          </div>
        </div>
      `;

      document.getElementById('go-to-sim-btn').addEventListener('click', () => {
        document.querySelector('[data-target="tab-simulation"]').click();
      });

    } else if (activeTab === 'tab-simulation') {
      mainArea.innerHTML = `
        <div class="panel">
          <div class="panel-header">
            <span class="panel-title">Operating Conditions Control</span>
          </div>

          <div class="control-group">
            <div class="control-label"><span>TEMPERATURE</span><span class="control-value" id="val-temp">${currentParams.temp} ${selectedAsset.paramRanges.temp[2]}</span></div>
            <input type="range" id="param-temp" min="${selectedAsset.paramRanges.temp[0]}" max="${selectedAsset.paramRanges.temp[1]}" value="${currentParams.temp}">
          </div>

          <div class="control-group">
            <div class="control-label"><span>OPERATING HOURS</span><span class="control-value" id="val-hours">${currentParams.hours} ${selectedAsset.paramRanges.hours[2]}</span></div>
            <input type="range" id="param-hours" min="${selectedAsset.paramRanges.hours[0]}" max="${selectedAsset.paramRanges.hours[1]}" value="${currentParams.hours}">
          </div>

          <div class="control-group">
            <div class="control-label"><span>SYSTEM LOAD</span><span class="control-value" id="val-load">${currentParams.load} %</span></div>
            <input type="range" id="param-load" min="0" max="100" value="${currentParams.load}">
          </div>

          <div class="control-group">
            <div class="control-label"><span>VIBRATION AMPLITUDE</span><span class="control-value" id="val-vibration">${currentParams.vibration} ${selectedAsset.paramRanges.vibration[2]}</span></div>
            <input type="range" id="param-vibration" min="0" max="${selectedAsset.paramRanges.vibration[1]}" step="0.1" value="${currentParams.vibration}">
          </div>

          <div class="control-group">
            <div class="control-label"><span>ENVIRONMENT SEVERITY</span></div>
            <div style="display:flex; gap:8px;">
              ${['Normal', 'Harsh', 'Extreme'].map(env => `
                <button class="c1-btn env-btn ${currentParams.environment === env ? 'c1-btn-primary' : ''}" data-env="${env}" style="flex:1;">${env}</button>
              `).join('')}
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <span class="panel-title">Real-Time Intelligence Output</span>
          </div>

          <div style="margin-bottom:16px;">
            <div style="font-family:var(--font-mono); font-size:11px; color:var(--text-muted); margin-bottom:4px;">FAILURE PROBABILITY</div>
            <div style="font-size:36px; font-weight:800; font-family:var(--font-mono); color:${simResult.failureProbability > 70 ? 'var(--status-red)' : 'var(--status-green)'}">
              ${simResult.failureProbability}%
            </div>
          </div>

          <div class="telemetry-canvas-container" style="margin-bottom:16px;">
            <canvas id="scope-canvas"></canvas>
          </div>

          <div style="font-family:var(--font-mono); font-size:11px; display:flex; flex-direction:column; gap:6px;">
            <div><span style="color:var(--text-muted);">HEALTH INDEX:</span> <strong style="color:#fff;">${simResult.healthScore} / 100</strong></div>
            <div><span style="color:var(--text-muted);">PREDICTED FAILURE WINDOW:</span> <strong style="color:var(--status-amber);">${simResult.predictedWindow}</strong></div>
            <div><span style="color:var(--text-muted);">PRIMARY RISK MODE:</span> <strong style="color:#fff;">${simResult.primaryFailure.mode}</strong></div>
          </div>
        </div>
      `;

      // Attach Range Controls Dynamic Events
      const bindRange = (id, key, suffix) => {
        const el = document.getElementById(id);
        if(!el) return;
        el.addEventListener('input', (e) => {
          currentParams[key] = parseFloat(e.target.value);
          document.getElementById(`val-${key}`).innerText = `${currentParams[key]} ${suffix}`;
          updateSimOutput();
        });
      };

      bindRange('param-temp', 'temp', selectedAsset.paramRanges.temp[2]);
      bindRange('param-hours', 'hours', selectedAsset.paramRanges.hours[2]);
      bindRange('param-load', 'load', '%');
      bindRange('param-vibration', 'vibration', selectedAsset.paramRanges.vibration[2]);

      document.querySelectorAll('.env-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          currentParams.environment = e.target.dataset.env;
          renderActiveTab();
        });
      });

      // Initialize Canvas Signal Oscilloscope
      scopeOscilloscope = new Oscilloscope('scope-canvas');
      scopeOscilloscope.setStress(simResult.failureProbability / 100);
      scopeOscilloscope.start();

      function updateSimOutput() {
        const res = SimulationEngine.analyze(selectedAsset, currentParams);
        if(scopeOscilloscope) scopeOscilloscope.setStress(res.failureProbability / 100);
        renderActiveTab();
      }

    } else if (activeTab === 'tab-analytics') {
      mainArea.innerHTML = `
        <div class="panel full-width">
          <div class="panel-header">
            <span class="panel-title">Reliability Analytics & System Dependency Mapping</span>
          </div>

          <div style="display:grid; grid-template-columns:1fr 2fr; gap:24px;">
            <div>
              <h3 style="font-family:var(--font-mono); font-size:14px; margin-bottom:12px; color:var(--text-bright);">Component Degradation Breakdown</h3>
              <div style="display:flex; flex-direction:column; gap:12px; font-family:var(--font-mono);">
                ${simResult.rankedModes.map(m => `
                  <div>
                    <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:4px;">
                      <span>${m.mode}</span>
                      <span>${m.probability}%</span>
                    </div>
                    <div style="width:100%; height:6px; background:var(--bg-primary); border:1px solid var(--border-subtle);">
                      <div style="width:${m.probability}%; height:100%; background:${m.probability > 70 ? 'var(--status-red)' : 'var(--status-amber)'}"></div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <div style="border-left:1px solid var(--border-subtle); padding-left:24px;">
              <h3 style="font-family:var(--font-mono); font-size:14px; margin-bottom:12px; color:var(--text-bright);">System Failure Cascading Dependency</h3>
              
              <div style="display:flex; align-items:center; gap:12px; font-family:var(--font-mono); font-size:12px;">
                <div style="padding:12px; background:var(--bg-tertiary); border:1px solid var(--border-strong); text-align:center;">
                  <div style="color:var(--text-muted); font-size:10px;">OPERATIONAL STRESS</div>
                  <strong>${currentParams.load}% Load / ${currentParams.temp}°C</strong>
                </div>
                <span>→</span>
                <div style="padding:12px; background:var(--bg-tertiary); border:1px solid var(--status-amber); text-align:center;">
                  <div style="color:var(--text-muted); font-size:10px;">PRIMARY DEGRADATION</div>
                  <strong style="color:var(--status-amber);">${simResult.primaryFailure.mode}</strong>
                </div>
                <span>→</span>
                <div style="padding:12px; background:var(--bg-tertiary); border:1px solid var(--status-red); text-align:center;">
                  <div style="color:var(--text-muted); font-size:10px;">CRITICAL SYSTEM RISK</div>
                  <strong style="color:var(--status-red);">${simResult.riskLevel} CATASTROPHIC RISK</strong>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;

    } else if (activeTab === 'tab-report') {
      mainArea.innerHTML = `
        <div class="panel full-width">
          <div class="panel-header">
            <span class="panel-title">Engineering Intelligence Report Generator</span>
            <button class="c1-btn c1-btn-primary" onclick="window.print()">Print / Export PDF Report</button>
          </div>

          <div style="background:#000; border:1px solid var(--border-strong); padding:32px; font-family:var(--font-mono); color:var(--text-main);">
            <div style="display:flex; justify-content:space-between; border-bottom:2px solid var(--text-bright); padding-bottom:16px; margin-bottom:24px;">
              <div>
                <h1 style="font-size:20px; color:#fff;">CONTINUUMONE INTELLIGENCE REPORT</h1>
                <div style="font-size:11px; color:var(--text-muted);">RELIABILITY ENGINEERING & FAILURE PREVENTION DIVISION</div>
              </div>
              <div style="text-align:right; font-size:11px;">
                <div>TIMESTAMP: ${new Date().toISOString()}</div>
                <div>SYSTEM ID: ${selectedAsset.id}</div>
              </div>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-bottom:24px;">
              <div>
                <h4 style="color:var(--text-muted); margin-bottom:8px;">ASSET IDENTIFICATION</h4>
                <div>Name: <strong>${selectedAsset.name}</strong></div>
                <div>Manufacturer: <strong>${selectedAsset.manufacturer}</strong></div>
                <div>System Architecture: <strong>${selectedAsset.systemType}</strong></div>
              </div>
              <div>
                <h4 style="color:var(--text-muted); margin-bottom:8px;">SIMULATION ASSESSMENT</h4>
                <div>Health Score: <strong>${simResult.healthScore} / 100</strong></div>
                <div>Failure Risk Level: <strong style="color:${simResult.riskLevel === 'EXTREME' ? 'var(--status-red)' : 'var(--status-green)'}">${simResult.riskLevel} (${simResult.failureProbability}%)</strong></div>
                <div>Estimated RUL: <strong>${simResult.rulHours} Operating Hours</strong></div>
              </div>
            </div>

            <div style="border-top:1px solid var(--border-subtle); padding-top:16px;">
              <h4 style="color:var(--text-muted); margin-bottom:8px;">RECOMMENDED ACTIONABLE INTELLIGENCE</h4>
              <p style="font-size:12px; line-height:1.6;">
                ${simResult.failureProbability > 60 ? 
                  `CRITICAL WARNING: Primary system shows advanced accelerated thermal/mechanical stress. Immediate inspection of ${simResult.primaryFailure.mode} recommended within ${simResult.predictedWindow}. Reduce operating load below 70% to extend useful remaining life.` : 
                  `SYSTEM NOMINAL: Asset operates within design tolerance boundaries. Next scheduled maintenance cycle standard.`
                }
              </p>
            </div>
          </div>
        </div>
      `;
    }
  }

  // Initial Load Boot sequence
  renderAssetList();
  renderActiveTab();
});
</script>
</body>

<script>
/* ==========================================================================
   ContinuumOne Simulation Engine & Real-Time Telemetry (Part 3)
   ========================================================================== */

/**
 * Predictive Simulation Intelligence Engine
 * Evaluates asset stress parameters against operational boundaries
 * to compute real-time failure probabilities and RUL forecasts.
 */
class SimulationEngine {
  static analyze(asset, currentParams) {
    const { temp, hours, load, vibration, maintenance, environment } = currentParams;
    const maxHours = asset.paramRanges.hours[1];
    
    // Normalized parameter stress values (0.0 to 1.0+)
    const tempRatio = temp / asset.paramRanges.temp[1];
    const hoursRatio = hours / maxHours;
    const loadRatio = load / 100;
    const vibRatio = vibration / asset.paramRanges.vibration[1];

    // Non-linear stress factor curves
    const tempStress = Math.pow(tempRatio, 1.8);
    const loadStress = Math.pow(loadRatio, 2.2);
    const hoursStress = Math.pow(hoursRatio, 1.2);
    const vibStress = Math.pow(vibRatio, 1.6);

    // Multipliers for operating environment and maintenance tier
    const envMultiplier = environment === 'Extreme' ? 1.45 : (environment === 'Harsh' ? 1.2 : 1.0);
    const maintMultiplier = maintenance === 'Low' ? 1.35 : (maintenance === 'High' ? 0.8 : 1.0);

    // Weighted cumulative risk matrix
    const baseRisk = (
      (tempStress * 0.30) + 
      (loadStress * 0.25) + 
      (hoursStress * 0.25) + 
      (vibStress * 0.20)
    ) * envMultiplier * maintMultiplier;

    // Clamped failure probability percentage (1% to 99%)
    const failureProbability = Math.min(Math.max(Math.round(baseRisk * 100), 1), 99);

    // Overall Health Index score (100 = optimal, 1 = critical failure)
    const healthScore = Math.max(100 - failureProbability, 1);

    // Remaining Useful Life (RUL) estimation in operating hours
    const remainingDesignLife = Math.max(maxHours - hours, 0);
    const stressDegradationRate = 1 + (failureProbability / 20);
    const rulHours = Math.max(Math.round(remainingDesignLife / stressDegradationRate), 10);
    
    const minWindow = Math.round(rulHours * 0.75);
    const maxWindow = Math.round(rulHours * 1.1);
    const predictedWindow = `${minWindow.toLocaleString()} - ${maxWindow.toLocaleString()} hrs`;

    // Dynamic failure mode probability distribution
    const rankedModes = asset.failureModes.map((mode, index) => {
      let weightFactor = tempStress;
      if (index === 1) weightFactor = vibStress;
      if (index === 2) weightFactor = hoursStress;

      const modeProb = Math.min(Math.round(failureProbability * (0.65 + weightFactor * 0.35)), 99);
      return { mode, probability: modeProb };
    }).sort((a, b) => b.probability - a.probability);

    // Categorical Risk Classification
    let riskLevel = "LOW";
    if (failureProbability >= 70) {
      riskLevel = "EXTREME";
    } else if (failureProbability >= 35) {
      riskLevel = "MEDIUM";
    }

    return {
      healthScore,
      failureProbability,
      riskLevel,
      rulHours,
      predictedWindow,
      primaryFailure: rankedModes[0],
      secondaryFailure: rankedModes[1] || rankedModes[0],
      rankedModes
    };
  }
}

/**
 * Real-Time Telemetry Oscilloscope Visualizer
 * Renders live signal waves, waveform noise, and mission-control grid lines
 * using standard HTML5 2D Canvas.
 */
class Oscilloscope {
  constructor(canvasId) {
    this.canvas = document.getElementById(canvasId);
    if (!this.canvas) return;
    this.ctx = this.canvas.getContext('2d');
    this.phase = 0;
    this.animId = null;
    this.stressLevel = 0.2; // Controls noise amplitude and wave jitter
  }

  setStress(stressRatio) {
    this.stressLevel = Math.min(Math.max(stressRatio, 0.05), 1.0);
  }

  start() {
    this.stop();
    const render = () => {
      this.draw();
      this.animId = requestAnimationFrame(render);
    };
    render();
  }

  stop() {
    if (this.animId) {
      cancelAnimationFrame(this.animId);
      this.animId = null;
    }
  }

  draw() {
    if (!this.canvas) return;
    
    // Auto-fit internal canvas pixel density
    const width = this.canvas.width = this.canvas.offsetWidth || 400;
    const height = this.canvas.height = this.canvas.offsetHeight || 200;
    const ctx = this.ctx;

    // Dark radar background
    ctx.fillStyle = '#030508';
    ctx.fillRect(0, 0, width, height);

    // Grid lines (Mission Control radar style)
    ctx.strokeStyle = 'rgba(28, 38, 56, 0.6)';
    ctx.lineWidth = 1;
    const gridSize = 24;

    for (let x = 0; x < width; x += gridSize) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, height);
      ctx.stroke();
    }

    for (let y = 0; y < height; y += gridSize) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(width, y);
      ctx.stroke();
    }

    // Dynamic wave color assignment based on system stress
    let waveColor = '#00e676'; // Healthy Green
    if (this.stressLevel > 0.65) {
      waveColor = '#ff1744'; // Extreme Danger Red
    } else if (this.stressLevel > 0.35) {
      waveColor = '#ffb300'; // Caution Amber
    }

    // Draw main oscilloscope signal line
    ctx.beginPath();
    ctx.lineWidth = 2;
    ctx.strokeStyle = waveColor;
    ctx.shadowColor = waveColor;
    ctx.shadowBlur = 8;

    this.phase += 0.04 + (this.stressLevel * 0.06);

    const centerY = height / 2;
    const waveAmplitude = 15 + (this.stressLevel * 35);
    const frequency = 0.025;

    for (let x = 0; x < width; x++) {
      // Harmonic wave components
      const sineWave = Math.sin(x * frequency + this.phase) * waveAmplitude;
      const cosineHarmonic = Math.cos(x * 0.08 - this.phase) * (waveAmplitude * 0.25);
      
      // High-stress signal distortion noise
      const noise = (Math.random() - 0.5) * (this.stressLevel * 18);
      const y = centerY + sineWave + cosineHarmonic + noise;

      if (x === 0) {
        ctx.moveTo(x, y);
      } else {
        ctx.lineTo(x, y);
      }
    }
    ctx.stroke();
    ctx.shadowBlur = 0; // Reset glow buffer
  }
}
</script>

          </div>

          <div style="background:#030508; border:1px solid var(--border-strong); padding:28px; font-family:var(--font-mono); color:var(--text-main);">
            <div style="display:flex; justify-content:space-between; border-bottom:2px solid var(--text-bright); padding-bottom:16px; margin-bottom:20px;">
              <div>
                <h1 style="font-size:18px; color:#fff; letter-spacing:1px;">CONTINUUMONE INTELLIGENCE REPORT</h1>
                <div style="font-size:10px; color:var(--text-muted);">RELIABILITY ENGINEERING & PREDICTIVE FAILURE PREVENTION PLATFORM</div>
              </div>
              <div style="text-align:right; font-size:10px; color:var(--text-muted);">
                <div>TIMESTAMP: ${new Date().toISOString()}</div>
                <div>NODE: APEX-01 // SIM-ID: ${selectedAsset.id}</div>
              </div>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px;">
              <div>
                <h4 style="color:var(--text-muted); margin-bottom:8px; font-size:11px;">ASSET IDENTIFICATION</h4>
                <div>System: <strong style="color:#fff;">${selectedAsset.name}</strong></div>
                <div>Manufacturer: <strong style="color:#fff;">${selectedAsset.manufacturer}</strong></div>
                <div>Model: <strong style="color:#fff;">${selectedAsset.model}</strong></div>
                <div>Category: <strong style="color:#fff;">${selectedAsset.category}</strong></div>
              </div>
              <div>
                <h4 style="color:var(--text-muted); margin-bottom:8px; font-size:11px;">SIMULATION ASSESSMENT SUMMARY</h4>
                <div>System Health Index: <strong style="color:#fff;">${simResult.healthScore} / 100</strong></div>
                <div>Failure Risk Level: <strong style="color:${simResult.failureProbability >= 70 ? 'var(--status-red)' : 'var(--status-green)'}">${simResult.riskLevel} (${simResult.failureProbability}%)</strong></div>
                <div>Remaining Useful Life: <strong style="color:#fff;">${simResult.rulHours} Operating Hours</strong></div>
                <div>Predicted Failure Window: <strong style="color:var(--status-amber);">${simResult.predictedWindow}</strong></div>
              </div>
            </div>

            <div style="border-top:1px solid var(--border-subtle); padding-top:16px;">
              <h4 style="color:var(--text-muted); margin-bottom:8px; font-size:11px;">ACTIONABLE ENGINEERING RECOMMENDATIONS</h4>
              <p style="font-size:11px; line-height:1.6; color:#ccc;">
                ${simResult.failureProbability >= 60 ? 
                  `CRITICAL WARNING: The ${selectedAsset.name} is exhibiting severe degradation risk driven primarily by ${simResult.primaryFailure.mode}. Immediate technical inspection is required within the ${simResult.predictedWindow} operational window. Reduce system load to lower thermal and vibrational stress.` : 
                  `SYSTEM NOMINAL: Asset operating within design engineering boundaries. Operational parameters show healthy stability. Continue standard maintenance cycles.`
                }
              </p>
            </div>
          </div>
        </div>
      `;
    }
  }

  // Initial Startup Execution
  renderAssetList();
  renderActiveTab();
});
</script>
</body>
</html>
